<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard | CAMPUSCORE</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: {
              orange: '#ea580c',
              amber: '#f97316',
              light: '#fff7ed',
              border: '#fed7aa',
              dark: '#7c2d12'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafaf9; }
    .card-warm-glow {
      box-shadow: 0 4px 20px -2px rgba(251, 146, 60, 0.12), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
    }
  </style>
</head>
<body class="bg-stone-50/60 text-slate-800 min-h-screen antialiased">
  <div id="root"></div>

  <!-- Shared Auth & API Script -->
  <script src="/static/app.js"></script>

  <!-- React Student Portal Component -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function StudentDashboard() {
      const [student, setStudent] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('overview'); // 'overview' | 'courses' | 'settings'
      const [isEditModalOpen, setIsEditModalOpen] = useState(false);
      const [editForm, setEditForm] = useState({});
      const [passwordForm, setPasswordForm] = useState({ current_password: '', new_password: '', confirm_password: '' });
      const [msg, setMsg] = useState(null);

      // Interactive Semester Catalog for Semester 1 to Semester 8
      const semesterCatalog = {
        'Semester 1': [
          { name: 'Technical English & Professional Communication', credits: 3, grade: 'A' },
          { name: 'Engineering Mathematics I (Calculus & Linear Algebra)', credits: 4, grade: 'A+' },
          { name: 'Engineering Physics & Materials Science', credits: 4, grade: 'O' },
          { name: 'Problem Solving and Python Programming', credits: 4, grade: 'O' },
          { name: 'Basic Electrical & Electronics Lab', credits: 2, grade: 'A+' }
        ],
        'Semester 2': [
          { name: 'Engineering Mathematics II (Differential Equations)', credits: 4, grade: 'A+' },
          { name: 'Programming in C & Data Structures', credits: 4, grade: 'O' },
          { name: 'Digital Principles and System Design', credits: 3, grade: 'A' },
          { name: 'Environmental Science and Engineering', credits: 3, grade: 'A+' },
          { name: 'Programming in C Laboratory', credits: 2, grade: 'O' }
        ],
        'Semester 3': [
          { name: 'Discrete Mathematics and Graph Theory', credits: 4, grade: 'A' },
          { name: 'Object-Oriented Programming (Java)', credits: 4, grade: 'O' },
          { name: 'Computer Organization and Architecture', credits: 3, grade: 'A+' },
          { name: 'Database Management Systems', credits: 4, grade: 'O' },
          { name: 'Data Structures and Algorithms Lab', credits: 2, grade: 'O' }
        ],
        'Semester 4': [
          { name: 'Probability, Statistics & Numerical Methods', credits: 4, grade: 'A+' },
          { name: 'Operating Systems & Kernel Design', credits: 4, grade: 'A' },
          { name: 'Design and Analysis of Algorithms', credits: 4, grade: 'O' },
          { name: 'Software Engineering & Agile Methodologies', credits: 3, grade: 'A+' },
          { name: 'Operating Systems and Networks Lab', credits: 2, grade: 'O' }
        ],
        'Semester 5': [
          { name: 'Data Structures & Advanced Algorithms', credits: 4, grade: 'A+' },
          { name: 'Database Management Systems', credits: 4, grade: 'O' },
          { name: 'Web Technologies & Frameworks', credits: 3, grade: 'O' },
          { name: 'Cloud Computing & DevOps Architecture', credits: 3, grade: 'A' },
          { name: 'Full-Stack Development Laboratory', credits: 2, grade: 'O' }
        ],
        'Semester 6': [
          { name: 'Artificial Intelligence & Machine Learning', credits: 4, grade: 'O' },
          { name: 'Cryptography and Network Security', credits: 3, grade: 'A+' },
          { name: 'Compiler Design & Theory of Computation', credits: 4, grade: 'A' },
          { name: 'Mobile Application Development (Flutter/React Native)', credits: 3, grade: 'O' },
          { name: 'AI & Machine Learning Laboratory', credits: 2, grade: 'O' }
        ],
        'Semester 7': [
          { name: 'Deep Learning & Neural Network Architectures', credits: 4, grade: 'O' },
          { name: 'Internet of Things & Embedded Systems', credits: 3, grade: 'A+' },
          { name: 'Big Data Analytics & Data Warehousing', credits: 3, grade: 'A' },
          { name: 'Professional Elective: Blockchain & Web3', credits: 3, grade: 'O' },
          { name: 'Capstone Project Work (Phase I)', credits: 3, grade: 'O' }
        ],
        'Semester 8': [
          { name: 'Capstone Degree Project (Phase II)', credits: 8, grade: 'O' },
          { name: 'Professional Ethics in Engineering', credits: 2, grade: 'A+' },
          { name: 'Industry Internship & Technical Seminar', credits: 4, grade: 'O' }
        ]
      };

      const gradePoints = {
        'O': 10,
        'A+': 9,
        'A': 8,
        'B+': 7,
        'B': 6,
        'C': 5,
        'U': 0
      };

      const possibleGrades = ['O', 'A+', 'A', 'B+', 'B'];

      // Interactive Particular Semester Credits & GPA Evaluator State
      const [calcSemester, setCalcSemester] = useState('Semester 5');
      const [evalCourses, setEvalCourses] = useState(semesterCatalog['Semester 5']);
      const [semesterResult, setSemesterResult] = useState(null);

      const computeResultForCourses = (semName, coursesList) => {
        let totalCredits = 0;
        let totalWeightedPoints = 0;
        let hasArrears = false;

        coursesList.forEach(c => {
          const cred = Number(c.credits) || 0;
          const gp = gradePoints[c.grade] !== undefined ? gradePoints[c.grade] : 8;
          if (c.grade === 'U') hasArrears = true;
          totalCredits += cred;
          totalWeightedPoints += cred * gp;
        });

        const sgpa = totalCredits > 0 ? (totalWeightedPoints / totalCredits) : 0;
        
        let standing = 'First Class with Distinction';
        let badgeColor = 'bg-emerald-50 text-emerald-800 border-emerald-300';
        if (hasArrears) {
          standing = 'Re-appear (Arrear Pending)';
          badgeColor = 'bg-rose-50 text-rose-800 border-rose-300';
        } else if (sgpa >= 9.0) {
          standing = 'First Class with Distinction (Exemplary Honors)';
          badgeColor = 'bg-emerald-50 text-emerald-800 border-emerald-300';
        } else if (sgpa >= 7.5) {
          standing = 'First Class with Distinction';
          badgeColor = 'bg-blue-50 text-blue-800 border-blue-300';
        } else if (sgpa >= 6.5) {
          standing = 'First Class';
          badgeColor = 'bg-amber-50 text-amber-800 border-amber-300';
        } else {
          standing = 'Second Class';
          badgeColor = 'bg-stone-50 text-stone-800 border-stone-300';
        }

        setSemesterResult({
          semester: semName,
          totalCredits,
          sgpa: sgpa.toFixed(2),
          totalPoints: totalWeightedPoints,
          standing,
          badgeColor
        });
      };

      const handleAddCourseRow = () => {
        setEvalCourses([...evalCourses, { name: 'Elective / Lab Course', credits: 3, grade: 'A+' }]);
      };

      const handleRemoveCourseRow = (index) => {
        if (evalCourses.length <= 1) return;
        setEvalCourses(evalCourses.filter((_, i) => i !== index));
      };

      const handleCourseChange = (index, field, value) => {
        const updated = [...evalCourses];
        updated[index][field] = field === 'credits' ? Number(value) : value;
        setEvalCourses(updated);
      };

      const computeSemesterResult = () => {
        computeResultForCourses(calcSemester, evalCourses);
      };

      // Randomize grades for a specific semester
      const randomizeForSemester = (semName) => {
        const baseCourses = semesterCatalog[semName] || semesterCatalog['Semester 1'];
        const randomized = baseCourses.map(course => {
          const randomGrade = possibleGrades[Math.floor(Math.random() * possibleGrades.length)];
          return {
            ...course,
            grade: randomGrade
          };
        });
        setCalcSemester(semName);
        setEvalCourses(randomized);
        computeResultForCourses(semName, randomized);
      };

      // Pick random semester 1 to 8
      const handleRandomSemester = () => {
        const semesters = ['Semester 1', 'Semester 2', 'Semester 3', 'Semester 4', 'Semester 5', 'Semester 6', 'Semester 7', 'Semester 8'];
        const randomSem = semesters[Math.floor(Math.random() * semesters.length)];
        randomizeForSemester(randomSem);
      };

      useEffect(() => {
        if (!window.auth.requireAuth('student')) return;
        fetchProfile();
        computeResultForCourses('Semester 5', semesterCatalog['Semester 5']);
      }, []);

      const fetchProfile = async () => {
        try {
          setLoading(true);
          const data = await window.api.getStudentProfile();
          setStudent(data);
          setEditForm({
            name: data.name,
            phone: data.phone || '',
            department: data.department,
            year: data.year,
            address: data.address || '',
            dob: data.dob || ''
          });
        } catch (err) {
          alert('Failed to load student profile: ' + err.message);
          window.auth.logout();
        } finally {
          setLoading(false);
        }
      };

      const handleUpdateProfile = async (e) => {
        e.preventDefault();
        try {
          const updated = await window.api.updateStudentProfile(editForm);
          setStudent(updated);
          setIsEditModalOpen(false);
          setMsg({ type: 'success', text: 'Profile details updated in database successfully!' });
          setTimeout(() => setMsg(null), 4000);
        } catch (err) {
          alert(err.message);
        }
      };

      const handleChangePassword = async (e) => {
        e.preventDefault();
        if (passwordForm.new_password !== passwordForm.confirm_password) {
          alert('New passwords do not match.');
          return;
        }
        try {
          await window.api.changePassword(passwordForm.current_password, passwordForm.new_password);
          setPasswordForm({ current_password: '', new_password: '', confirm_password: '' });
          setMsg({ type: 'success', text: 'Password successfully changed!' });
          setTimeout(() => setMsg(null), 4000);
        } catch (err) {
          alert(err.message);
        }
      };

      if (loading) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-stone-50">
            <div className="animate-spin rounded-full h-12 w-12 border-4 border-orange-500 border-t-transparent"></div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col lg:flex-row">
          {/* Sidebar with Warm Enterprise Styling */}
          <aside className="w-full lg:w-64 bg-stone-900 text-white flex-shrink-0 flex flex-col justify-between border-r border-stone-800">
            <div>
              {/* Brand Header */}
              <div className="p-6 border-b border-stone-800 flex items-center gap-3">
                <img src="/static/campuscore-logo.png" alt="CAMPUSCORE Logo" className="w-11 h-11 rounded-full border border-orange-400 object-cover shadow-sm bg-white" />
                <div>
                  <h1 className="font-extrabold text-white text-base tracking-wide">CAMPUSCORE</h1>
                  <span className="text-[11px] text-orange-400 font-bold tracking-wider uppercase">Student Portal</span>
                </div>
              </div>

              {/* Navigation Items */}
              <nav className="p-4 space-y-1.5">
                <button
                  onClick={() => setActiveTab('overview')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-bold transition ${
                    activeTab === 'overview'
                      ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-sm'
                      : 'text-stone-400 hover:bg-stone-800 hover:text-white'
                  }`}
                >
                  <span>📊</span> Overview & Profile
                </button>
                <button
                  onClick={() => setActiveTab('courses')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-bold transition ${
                    activeTab === 'courses'
                      ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-sm'
                      : 'text-stone-400 hover:bg-stone-800 hover:text-white'
                  }`}
                >
                  <span>📚</span> Enrolled Courses ({student?.courses?.length || 0})
                </button>
                <button
                  onClick={() => setActiveTab('settings')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-bold transition ${
                    activeTab === 'settings'
                      ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-sm'
                      : 'text-stone-400 hover:bg-stone-800 hover:text-white'
                  }`}
                >
                  <span>⚙️</span> Security & Password
                </button>
              </nav>
            </div>

            {/* User Info & Logout */}
            <div className="p-4 border-t border-stone-800">
              <div className="flex items-center gap-3 mb-3 p-2.5 rounded-xl bg-stone-800/70 border border-stone-700/60">
                <div className="w-9 h-9 rounded-full bg-gradient-to-r from-orange-500 to-orange-600 text-white font-extrabold flex items-center justify-center text-sm shadow-xs">
                  {student?.name?.charAt(0) || 'S'}
                </div>
                <div className="overflow-hidden">
                  <p className="text-sm font-bold text-white truncate">{student?.name}</p>
                  <p className="text-xs text-orange-300 font-medium truncate">{student?.student_id}</p>
                </div>
              </div>

              <button
                onClick={() => window.auth.logout()}
                className="w-full py-2 px-3 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 hover:text-rose-300 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 border border-rose-500/20"
              >
                <span>🚪</span> Sign Out
              </button>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 p-6 lg:p-10 max-w-7xl mx-auto w-full">
            {/* Top Navigation Bar */}
            <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-6 border-b border-orange-200/60">
              <div>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-stone-900 tracking-tight">
                  Welcome, {student?.name}!
                </h2>
                <p className="text-sm text-[#9a3412] font-semibold mt-1">
                  Department of {student?.department} • {student?.year}
                </p>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setIsEditModalOpen(true)}
                  className="px-4 py-2.5 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white text-sm font-bold rounded-lg shadow-sm hover:shadow transition flex items-center gap-2"
                >
                  <span>✏️</span> Edit Profile
                </button>
              </div>
            </header>

            {/* Notification Banner */}
            {msg && (
              <div className="mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm font-semibold flex items-center gap-2 shadow-xs">
                <span>✓</span> {msg.text}
              </div>
            )}

            {/* TAB 1: OVERVIEW & PROFILE */}
            {activeTab === 'overview' && (
              <div className="space-y-6">
                {/* Metric Summary Cards */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-2xl border border-orange-200/80 card-warm-glow">
                    <p className="text-xs font-bold text-stone-400 uppercase tracking-wider">Cumulative GPA</p>
                    <p className="text-3xl font-extrabold text-orange-600 mt-1">{student?.cgpa?.toFixed(2)} / 10</p>
                    <span className="text-xs text-emerald-600 font-bold">★ First Class with Distinction</span>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-orange-200/80 card-warm-glow">
                    <p className="text-xs font-bold text-stone-400 uppercase tracking-wider">Student ID</p>
                    <p className="text-2xl font-extrabold text-stone-800 mt-1">{student?.student_id}</p>
                    <span className="text-xs text-stone-500 font-medium">Official Institutional ID</span>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-orange-200/80 card-warm-glow">
                    <p className="text-xs font-bold text-stone-400 uppercase tracking-wider">Academic Year</p>
                    <p className="text-2xl font-extrabold text-stone-800 mt-1">{student?.year}</p>
                    <span className="text-xs text-stone-500 font-medium">Regular Student Status</span>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-orange-200/80 card-warm-glow">
                    <p className="text-xs font-bold text-stone-400 uppercase tracking-wider">Enrolled Courses</p>
                    <p className="text-2xl font-extrabold text-stone-800 mt-1">{student?.courses?.length || 0}</p>
                    <span className="text-xs text-orange-600 font-bold">Current Semester</span>
                  </div>
                </div>

                {/* Personal & Academic Details Grid */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* Personal Information Card */}
                  <div className="bg-white rounded-2xl border border-orange-200/80 card-warm-glow p-6">
                    <div className="flex items-center justify-between pb-4 border-b border-orange-100 mb-4">
                      <h3 className="font-extrabold text-stone-900 text-lg">Personal Information</h3>
                      <button onClick={() => setIsEditModalOpen(true)} className="text-xs text-orange-600 font-bold hover:underline">
                        Edit Details
                      </button>
                    </div>

                    <dl className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Full Name</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.name}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Email Address</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.email}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Contact Number</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.phone || 'Not provided'}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Date of Birth</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.dob || 'Not provided'}</dd>
                      </div>
                      <div className="sm:col-span-2">
                        <dt className="text-xs font-semibold text-stone-400">Residential Address</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.address || 'Not provided'}</dd>
                      </div>
                    </dl>
                  </div>

                  {/* Academic Profile Card */}
                  <div className="bg-white rounded-2xl border border-orange-200/80 card-warm-glow p-6">
                    <div className="flex items-center justify-between pb-4 border-b border-orange-100 mb-4">
                      <h3 className="font-extrabold text-stone-900 text-lg">Academic Standing</h3>
                      <span className="px-2.5 py-1 bg-emerald-50 text-emerald-700 text-xs font-bold rounded-full border border-emerald-200">Active</span>
                    </div>

                    <dl className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Department</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.department}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Roll Number</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.student_id}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Current Semester/Year</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.year}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Grading System</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">10.0 Scale (Choice Based)</dd>
                      </div>
                      <div className="sm:col-span-2 pt-2">
                        <div className="p-3.5 bg-[#fff7ed] border border-[#fed7aa] rounded-xl">
                          <p className="text-xs text-[#7c2d12] font-bold">Institutional Status</p>
                          <p className="text-xs text-[#9a3412] mt-0.5 font-medium">Good academic standing with all coursework prerequisites completed.</p>
                        </div>
                      </div>
                    </dl>
                  </div>
                </div>

                {/* INTERACTIVE SEMESTER CREDITS & FINAL RESULT EVALUATOR */}
                <div className="bg-white rounded-2xl border border-orange-200/80 card-warm-glow p-6">
                  <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 pb-4 border-b border-orange-100 mb-4">
                    <div>
                      <h3 className="font-extrabold text-stone-900 text-lg">Semester Credits & Result Evaluator</h3>
                      <p className="text-xs text-[#9a3412] font-medium mt-0.5">
                        Select any semester (Sem 1 to 8) or randomize to evaluate your credits, grades, and official final standing
                      </p>
                    </div>

                    <div className="flex items-center gap-2">
                      {/* Randomizer Button */}
                      <button
                        type="button"
                        onClick={handleRandomSemester}
                        className="px-3 py-1.5 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-extrabold text-xs rounded-xl shadow-xs transition flex items-center gap-1.5"
                      >
                        <span>🎲</span>
                        <span>Random Sem 1–8</span>
                      </button>

                      {/* Dropdown Selector */}
                      <select
                        value={calcSemester}
                        onChange={(e) => randomizeForSemester(e.target.value)}
                        className="bg-[#fff7ed] border border-[#fed7aa] px-3 py-1.5 rounded-xl text-xs font-black text-[#7c2d12] focus:outline-none focus:ring-2 focus:ring-orange-500 cursor-pointer shadow-2xs"
                      >
                        <option>Semester 1</option>
                        <option>Semester 2</option>
                        <option>Semester 3</option>
                        <option>Semester 4</option>
                        <option>Semester 5</option>
                        <option>Semester 6</option>
                        <option>Semester 7</option>
                        <option>Semester 8</option>
                      </select>
                    </div>
                  </div>

                  {/* Quick Semester 1 to Semester 8 Selection Pills */}
                  <div className="flex flex-wrap items-center gap-1.5 mb-5 p-2 bg-[#fff7ed]/60 rounded-xl border border-[#fed7aa]/70">
                    <span className="text-[11px] font-black uppercase text-[#c2410c] mr-1 ml-1">Semesters:</span>
                    {['Semester 1', 'Semester 2', 'Semester 3', 'Semester 4', 'Semester 5', 'Semester 6', 'Semester 7', 'Semester 8'].map((sem, i) => (
                      <button
                        key={i}
                        type="button"
                        onClick={() => randomizeForSemester(sem)}
                        className={`px-2.5 py-1 text-xs font-extrabold rounded-lg transition ${
                          calcSemester === sem
                            ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-xs'
                            : 'bg-white hover:bg-orange-100/60 text-stone-700 border border-[#fed7aa]/60'
                        }`}
                      >
                        Sem {i + 1}
                      </button>
                    ))}
                  </div>

                  {/* Course / Credits / Grade Input Rows */}
                  <div className="space-y-3 mb-4">
                    <div className="flex justify-between items-center text-xs font-extrabold text-stone-400 uppercase tracking-wider px-2">
                      <span className="w-1/2">Course / Subject Name</span>
                      <span className="w-1/4 text-center">Semester Credits</span>
                      <span className="w-1/4 text-right">Grade Obtained</span>
                    </div>

                    {evalCourses.map((course, idx) => (

                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-stone-700 mb-1">Academic Year</label>
                        <select
                          value={editForm.year}
                          onChange={(e) => setEditForm({ ...editForm, year: e.target.value })}
                          className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm"
                        >
                          <option>1st Year</option>
                          <option>2nd Year</option>
                          <option>3rd Year</option>
                          <option>4th Year</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-stone-700 mb-1">Residential Address</label>
                      <textarea
                        rows="2"
                        value={editForm.address}
                        onChange={(e) => setEditForm({ ...editForm, address: e.target.value })}
                        className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500"
                      ></textarea>
                    </div>

                    <div className="flex justify-end gap-2 pt-2 border-t border-stone-100">
                      <button
                        type="button"
                        onClick={() => setIsEditModalOpen(false)}
                        className="px-4 py-2 border border-stone-300 rounded-lg text-sm text-stone-700 hover:bg-stone-50 font-bold"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white rounded-lg text-sm font-bold shadow-sm"
                      >
                        Save Changes
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StudentDashboard />);
  </script>
</body>
</html>
