<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard | CAMPUSCORE</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: {
              orange: '#ea580c',
              amber: '#f97316',
              light: '#fff7ed',
              border: '#fed7aa',
              dark: '#7c2d12'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafaf9; }
    .card-warm-glow {
      box-shadow: 0 4px 20px -2px rgba(251, 146, 60, 0.12), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
    }
  </style>
</head>
<body class="bg-stone-50/60 text-slate-800 min-h-screen antialiased">
  <div id="root"></div>

  <!-- Shared Auth & API Script -->
  <script src="/static/app.js"></script>

  <!-- React Student Portal Component -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function StudentDashboard() {
      const [student, setStudent] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('overview'); // 'overview' | 'courses' | 'settings'
      const [isEditModalOpen, setIsEditModalOpen] = useState(false);
      const [editForm, setEditForm] = useState({});
      const [passwordForm, setPasswordForm] = useState({ current_password: '', new_password: '', confirm_password: '' });
      const [msg, setMsg] = useState(null);

      useEffect(() => {
        if (!window.auth.requireAuth('student')) return;
        fetchProfile();
      }, []);

      const fetchProfile = async () => {
        try {
          setLoading(true);
          const data = await window.api.getStudentProfile();
          setStudent(data);
          setEditForm({
            name: data.name,
            phone: data.phone || '',
            department: data.department,
            year: data.year,
            address: data.address || '',
            dob: data.dob || ''
          });
        } catch (err) {
          alert('Failed to load student profile: ' + err.message);
          window.auth.logout();
        } finally {
          setLoading(false);
        }
      };

      const handleUpdateProfile = async (e) => {
        e.preventDefault();
        try {
          const updated = await window.api.updateStudentProfile(editForm);
          setStudent(updated);
          setIsEditModalOpen(false);
          setMsg({ type: 'success', text: 'Profile details updated in database successfully!' });
          setTimeout(() => setMsg(null), 4000);
        } catch (err) {
          alert(err.message);
        }
      };

      const handleChangePassword = async (e) => {
        e.preventDefault();
        if (passwordForm.new_password !== passwordForm.confirm_password) {
          alert('New passwords do not match.');
          return;
        }
        try {
          await window.api.changePassword(passwordForm.current_password, passwordForm.new_password);
          setPasswordForm({ current_password: '', new_password: '', confirm_password: '' });
          setMsg({ type: 'success', text: 'Password successfully changed!' });
          setTimeout(() => setMsg(null), 4000);
        } catch (err) {
          alert(err.message);
        }
      };

      if (loading) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-stone-50">
            <div className="animate-spin rounded-full h-12 w-12 border-4 border-orange-500 border-t-transparent"></div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col lg:flex-row">
          {/* Sidebar with Warm Enterprise Styling */}
          <aside className="w-full lg:w-64 bg-stone-900 text-white flex-shrink-0 flex flex-col justify-between border-r border-stone-800">
            <div>
              {/* Brand Header */}
              <div className="p-6 border-b border-stone-800 flex items-center gap-3">
                <img src="/static/campuscore-logo.png" alt="CAMPUSCORE Logo" className="w-11 h-11 rounded-full border border-orange-400 object-cover shadow-sm bg-white" />
                <div>
                  <h1 className="font-extrabold text-white text-base tracking-wide">CAMPUSCORE</h1>
                  <span className="text-[11px] text-orange-400 font-bold tracking-wider uppercase">Student Portal</span>
                </div>
              </div>

              {/* Navigation Items */}
              <nav className="p-4 space-y-1.5">
                <button
                  onClick={() => setActiveTab('overview')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-bold transition ${
                    activeTab === 'overview'
                      ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-sm'
                      : 'text-stone-400 hover:bg-stone-800 hover:text-white'
                  }`}
                >
                  <span>📊</span> Overview & Profile
                </button>
                <button
                  onClick={() => setActiveTab('courses')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-bold transition ${
                    activeTab === 'courses'
                      ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-sm'
                      : 'text-stone-400 hover:bg-stone-800 hover:text-white'
                  }`}
                >
                  <span>📚</span> Enrolled Courses ({student?.courses?.length || 0})
                </button>
                <button
                  onClick={() => setActiveTab('settings')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-bold transition ${
                    activeTab === 'settings'
                      ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-sm'
                      : 'text-stone-400 hover:bg-stone-800 hover:text-white'
                  }`}
                >
                  <span>⚙️</span> Security & Password
                </button>
              </nav>
            </div>

            {/* User Info & Logout */}
            <div className="p-4 border-t border-stone-800">
              <div className="flex items-center gap-3 mb-3 p-2.5 rounded-xl bg-stone-800/70 border border-stone-700/60">
                <div className="w-9 h-9 rounded-full bg-gradient-to-r from-orange-500 to-orange-600 text-white font-extrabold flex items-center justify-center text-sm shadow-xs">
                  {student?.name?.charAt(0) || 'S'}
                </div>
                <div className="overflow-hidden">
                  <p className="text-sm font-bold text-white truncate">{student?.name}</p>
                  <p className="text-xs text-orange-300 font-medium truncate">{student?.student_id}</p>
                </div>
              </div>

              <button
                onClick={() => window.auth.logout()}
                className="w-full py-2 px-3 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 hover:text-rose-300 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 border border-rose-500/20"
              >
                <span>🚪</span> Sign Out
              </button>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 p-6 lg:p-10 max-w-7xl mx-auto w-full">
            {/* Top Navigation Bar */}
            <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-6 border-b border-orange-200/60">
              <div>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-stone-900 tracking-tight">
                  Welcome, {student?.name}!
                </h2>
                <p className="text-sm text-[#9a3412] font-semibold mt-1">
                  Department of {student?.department} • {student?.year}
                </p>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setIsEditModalOpen(true)}
                  className="px-4 py-2.5 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white text-sm font-bold rounded-lg shadow-sm hover:shadow transition flex items-center gap-2"
                >
                  <span>✏️</span> Edit Profile
                </button>
              </div>
            </header>

            {/* Notification Banner */}
            {msg && (
              <div className="mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm font-semibold flex items-center gap-2 shadow-xs">
                <span>✓</span> {msg.text}
              </div>
            )}

            {/* TAB 1: OVERVIEW & PROFILE */}
            {activeTab === 'overview' && (
              <div className="space-y-6">
                {/* Metric Summary Cards */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-2xl border border-orange-200/80 card-warm-glow">
                    <p className="text-xs font-bold text-stone-400 uppercase tracking-wider">Cumulative GPA</p>
                    <p className="text-3xl font-extrabold text-orange-600 mt-1">{student?.cgpa?.toFixed(2)} / 10</p>
                    <span className="text-xs text-emerald-600 font-bold">★ First Class with Distinction</span>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-orange-200/80 card-warm-glow">
                    <p className="text-xs font-bold text-stone-400 uppercase tracking-wider">Student ID</p>
                    <p className="text-2xl font-extrabold text-stone-800 mt-1">{student?.student_id}</p>
                    <span className="text-xs text-stone-500 font-medium">Official Institutional ID</span>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-orange-200/80 card-warm-glow">
                    <p className="text-xs font-bold text-stone-400 uppercase tracking-wider">Academic Year</p>
                    <p className="text-2xl font-extrabold text-stone-800 mt-1">{student?.year}</p>
                    <span className="text-xs text-stone-500 font-medium">Regular Student Status</span>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-orange-200/80 card-warm-glow">
                    <p className="text-xs font-bold text-stone-400 uppercase tracking-wider">Enrolled Courses</p>
                    <p className="text-2xl font-extrabold text-stone-800 mt-1">{student?.courses?.length || 0}</p>
                    <span className="text-xs text-orange-600 font-bold">Current Semester</span>
                  </div>
                </div>

                {/* Personal & Academic Details Grid */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* Personal Information Card */}
                  <div className="bg-white rounded-2xl border border-orange-200/80 card-warm-glow p-6">
                    <div className="flex items-center justify-between pb-4 border-b border-orange-100 mb-4">
                      <h3 className="font-extrabold text-stone-900 text-lg">Personal Information</h3>
                      <button onClick={() => setIsEditModalOpen(true)} className="text-xs text-orange-600 font-bold hover:underline">
                        Edit Details
                      </button>
                    </div>

                    <dl className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Full Name</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.name}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Email Address</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.email}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Contact Number</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.phone || 'Not provided'}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Date of Birth</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.dob || 'Not provided'}</dd>
                      </div>
                      <div className="sm:col-span-2">
                        <dt className="text-xs font-semibold text-stone-400">Residential Address</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.address || 'Not provided'}</dd>
                      </div>
                    </dl>
                  </div>

                  {/* Academic Profile Card */}
                  <div className="bg-white rounded-2xl border border-orange-200/80 card-warm-glow p-6">
                    <div className="flex items-center justify-between pb-4 border-b border-orange-100 mb-4">
                      <h3 className="font-extrabold text-stone-900 text-lg">Academic Standing</h3>
                      <span className="px-2.5 py-1 bg-emerald-50 text-emerald-700 text-xs font-bold rounded-full border border-emerald-200">Active</span>
                    </div>

                    <dl className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Department</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.department}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Roll Number</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.student_id}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Current Semester/Year</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">{student?.year}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-semibold text-stone-400">Grading System</dt>
                        <dd className="font-bold text-stone-800 mt-0.5">10.0 Scale (Choice Based)</dd>
                      </div>
                      <div className="sm:col-span-2 pt-2">
                        <div className="p-3.5 bg-[#fff7ed] border border-[#fed7aa] rounded-xl">
                          <p className="text-xs text-[#7c2d12] font-bold">Institutional Status</p>
                          <p className="text-xs text-[#9a3412] mt-0.5 font-medium">Good academic standing with all coursework prerequisites completed.</p>
                        </div>
                      </div>
                    </dl>
                  </div>
                </div>

                {/* Additional Content: Semester-Wise Performance & Academic Progression */}
                <div className="bg-white rounded-2xl border border-orange-200/80 card-warm-glow p-6">
                  <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2 pb-4 border-b border-orange-100 mb-5">
                    <div>
                      <h3 className="font-extrabold text-stone-900 text-lg">Semester Performance & GPA Progression</h3>
                      <p className="text-xs text-[#9a3412] font-medium mt-0.5">Historical academic progression across semesters</p>
                    </div>
                    <span className="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full w-fit">
                      Overall CGPA: {student?.cgpa?.toFixed(2)} / 10
                    </span>
                  </div>

                  {/* Semester Breakdown Grid */}
                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-6">
                    <div className="p-3.5 bg-stone-50 rounded-xl border border-stone-200 text-center">
                      <p className="text-[11px] font-bold text-stone-500 uppercase">Semester 1</p>
                      <p className="text-xl font-extrabold text-stone-900 mt-1">8.85</p>
                      <p className="text-[10px] text-emerald-600 font-bold">22 Credits</p>
                    </div>
                    <div className="p-3.5 bg-stone-50 rounded-xl border border-stone-200 text-center">
                      <p className="text-[11px] font-bold text-stone-500 uppercase">Semester 2</p>
                      <p className="text-xl font-extrabold text-stone-900 mt-1">9.00</p>
                      <p className="text-[10px] text-emerald-600 font-bold">24 Credits</p>
                    </div>
                    <div className="p-3.5 bg-stone-50 rounded-xl border border-stone-200 text-center">
                      <p className="text-[11px] font-bold text-stone-500 uppercase">Semester 3</p>
                      <p className="text-xl font-extrabold text-stone-900 mt-1">9.20</p>
                      <p className="text-[10px] text-emerald-600 font-bold">24 Credits</p>
                    </div>
                    <div className="p-3.5 bg-stone-50 rounded-xl border border-stone-200 text-center">
                      <p className="text-[11px] font-bold text-stone-500 uppercase">Semester 4</p>
                      <p className="text-xl font-extrabold text-stone-900 mt-1">9.10</p>
                      <p className="text-[10px] text-emerald-600 font-bold">22 Credits</p>
                    </div>
                    <div className="p-3.5 bg-gradient-to-br from-[#fff7ed] to-orange-100/70 rounded-xl border border-[#fed7aa] text-center col-span-2 sm:col-span-1">
                      <p className="text-[11px] font-bold text-orange-700 uppercase">Sem 5 (Current)</p>
                      <p className="text-xl font-extrabold text-orange-700 mt-1">9.35</p>
                      <p className="text-[10px] text-orange-800 font-bold">14 Credits</p>
                    </div>
                  </div>

                  {/* Degree Completion Progress Bar */}
                  <div>
                    <div className="flex justify-between text-xs font-bold text-stone-700 mb-1.5">
                      <span>Degree Completion Progress</span>
                      <span className="text-orange-600">92 / 120 Total Degree Credits Completed (76.6%)</span>
                    </div>
                    <div className="w-full bg-stone-100 rounded-full h-3 border border-stone-200 overflow-hidden">
                      <div className="bg-gradient-to-r from-orange-500 to-orange-600 h-3 rounded-full" style={{ width: '76.6%' }}></div>
                    </div>
                  </div>
                </div>

                {/* Additional Content: Attendance & Academic Milestones */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* Attendance & Honors Card */}
                  <div className="bg-white rounded-2xl border border-orange-200/80 card-warm-glow p-6">
                    <h3 className="font-extrabold text-stone-900 text-base mb-4 pb-2 border-b border-orange-100">
                      Attendance & Institutional Milestones
                    </h3>
                    <div className="space-y-3.5">
                      <div className="flex items-center justify-between p-3 bg-emerald-50/70 rounded-xl border border-emerald-200">
                        <div className="flex items-center gap-2.5">
                          <span className="text-lg">📊</span>
                          <div>
                            <p className="text-xs font-bold text-emerald-900">Overall Semester Attendance</p>
                            <p className="text-[11px] text-emerald-700">Eligible for end-semester examinations</p>
                          </div>
                        </div>
                        <span className="text-lg font-black text-emerald-700">94.8%</span>
                      </div>

                      <div className="flex items-center gap-3 p-3 bg-stone-50 rounded-xl border border-stone-200">
                        <span className="text-lg">🎖️</span>
                        <div>
                          <p className="text-xs font-bold text-stone-800">Dean’s Merit Honor Roll</p>
                          <p className="text-[11px] text-stone-500">Awarded for ranking in top 5% of department</p>
                        </div>
                      </div>

                      <div className="flex items-center gap-3 p-3 bg-stone-50 rounded-xl border border-stone-200">
                        <span className="text-lg">📜</span>
                        <div>
                          <p className="text-xs font-bold text-stone-800">Co-Curricular Certification</p>
                          <p className="text-[11px] text-stone-500">IEEE Student Chapter Member & Hackathon Finalist</p>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Recent Academic Activity Feed */}
                  <div className="bg-white rounded-2xl border border-orange-200/80 card-warm-glow p-6">
                    <h3 className="font-extrabold text-stone-900 text-base mb-4 pb-2 border-b border-orange-100">
                      Recent Academic Activity
                    </h3>
                    <div className="space-y-3">
                      <div className="flex items-start gap-3 p-2.5 rounded-lg hover:bg-stone-50 transition border border-stone-100">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 mt-1.5 flex-shrink-0"></span>
                        <div className="text-xs">
                          <p className="font-bold text-stone-800">CS301 Algorithm Analysis Assignment 3 Evaluated</p>
                          <p className="text-stone-500 text-[11px]">Score: 29/30 (Grade: A+) • Nov 15, 2026</p>
                        </div>
                      </div>

                      <div className="flex items-start gap-3 p-2.5 rounded-lg hover:bg-stone-50 transition border border-stone-100">
                        <span className="w-2 h-2 rounded-full bg-blue-500 mt-1.5 flex-shrink-0"></span>
                        <div className="text-xs">
                          <p className="font-bold text-stone-800">CS302 DBMS Schema Normalization Viva Cleared</p>
                          <p className="text-stone-500 text-[11px]">Practical Lab Evaluator: Prof. M. Anitha • Nov 12, 2026</p>
                        </div>
                      </div>

                      <div className="flex items-start gap-3 p-2.5 rounded-lg hover:bg-stone-50 transition border border-stone-100">
                        <span className="w-2 h-2 rounded-full bg-orange-500 mt-1.5 flex-shrink-0"></span>
                        <div className="text-xs">
                          <p className="font-bold text-stone-800">Semester 5 Examination Hall Ticket Generated</p>
                          <p className="text-stone-500 text-[11px]">Download available under Exam Center • Nov 10, 2026</p>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: ENROLLED COURSES */}
            {activeTab === 'courses' && (
              <div className="space-y-6">
                {/* Main Enrolled Courses Table */}
                <div className="bg-white rounded-2xl border border-orange-200/80 card-warm-glow overflow-hidden">
                  <div className="p-6 border-b border-orange-100 flex justify-between items-center bg-[#fff7ed]/50">
                    <div>
                      <h3 className="text-lg font-bold text-stone-900">Current Semester Enrolled Courses</h3>
                      <p className="text-xs text-[#9a3412] font-medium mt-0.5">Academic coursework and earned credits</p>
                    </div>
                    <span className="text-xs font-bold text-[#c2410c] bg-white border border-[#fed7aa] px-3.5 py-1.5 rounded-full shadow-xs">
                      Total Credits: {student?.courses?.reduce((acc, c) => acc + c.credits, 0) || 0}
                    </span>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm text-stone-700">
                      <thead className="bg-stone-50 text-xs uppercase font-extrabold text-stone-500 border-b border-stone-200">
                        <tr>
                          <th className="px-6 py-3.5">Course Code</th>
                          <th className="px-6 py-3.5">Course Title</th>
                          <th className="px-6 py-3.5">Semester</th>
                          <th className="px-6 py-3.5">Credits</th>
                          <th className="px-6 py-3.5">Grade</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-stone-100">
                        {student?.courses?.map((c) => (
                          <tr key={c.id} className="hover:bg-orange-50/40 transition">
                            <td className="px-6 py-4 font-extrabold text-orange-600">{c.course_code}</td>
                            <td className="px-6 py-4 font-bold text-stone-900">{c.course_name}</td>
                            <td className="px-6 py-4 text-stone-500">{c.semester}</td>
                            <td className="px-6 py-4 font-semibold">{c.credits} Credits</td>
                            <td className="px-6 py-4">
                              <span className="px-2.5 py-1 bg-emerald-100 text-emerald-800 font-extrabold rounded text-xs">
                                {c.grade}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Additional Content: Course Instructors & Timetable */}
                <div className="bg-white rounded-2xl border border-orange-200/80 card-warm-glow p-6">
                  <div className="pb-4 border-b border-orange-100 mb-5">
                    <h3 className="font-extrabold text-stone-900 text-lg">Course Instructors & Lecture Schedule</h3>
                    <p className="text-xs text-[#9a3412] font-medium mt-0.5">Faculty mentors, lecture room allocations, and attendance breakdown</p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="p-4 bg-stone-50/80 rounded-xl border border-stone-200">

                      </div>
                      <p className="text-xs text-stone-600 mt-1"><strong>Instructor:</strong> Dr. K. Sharma, Ph.D. • Room CS-204</p>
                      <p className="text-xs text-stone-500 mt-0.5">Mon / Wed / Fri • 10:00 AM – 11:30 AM</p>
                    </div>

                    <div className="p-4 bg-stone-50/80 rounded-xl border border-stone-200">
                      <div className="flex justify-between items-start mb-2">

                          <span className="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-orange-100 text-orange-700">CS302</span>

                        </div>
                        <span className="text-xs font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">92.0% Attd</span>
                      </div>
                      <p className="text-xs text-stone-600 mt-1"><strong>Instructor:</strong> Prof. M. Anitha, M.Tech. • Room CS-301</p>
                      <p className="text-xs text-stone-500 mt-0.5">Tue / Thu • 11:30 AM – 01:00 PM</p>
                    </div>

                    <div className="p-4 bg-stone-50/80 rounded-xl border border-stone-200">
                      <div className="flex justify-between items-start mb-2">
                        <div>
                          <span className="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-orange-100 text-orange-700">CS303</span>
                          <h4 className="font-bold text-sm text-stone-900 mt-1">Web Technologies & Frameworks</h4>
                        </div>
                        <span className="text-xs font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">98.0% Attd</span>
                      </div>
                      <p className="text-xs text-stone-600 mt-1"><strong>Instructor:</strong> Dr. R. Vignesh, Ph.D. • Software Lab 2</p>
                      <p className="text-xs text-stone-500 mt-0.5">Mon / Thu • 02:00 PM – 04:00 PM</p>
                    </div>

                    <div className="p-4 bg-stone-50/80 rounded-xl border border-stone-200">
                      <div className="flex justify-between items-start mb-2">
                        <div>
                          <span className="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-orange-100 text-orange-700">CS304</span>
                          <h4 className="font-bold text-sm text-stone-900 mt-1">Cloud Computing & DevOps</h4>
                        </div>
                        <span className="text-xs font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">94.5% Attd</span>
                      </div>
                      <p className="text-xs text-stone-600 mt-1"><strong>Instructor:</strong> Prof. S. Rajesh, M.E. • Cloud Systems Lab</p>
                      <p className="text-xs text-stone-500 mt-0.5">Wed / Fri • 02:00 PM – 04:00 PM</p>

                    <p className="text-xs text-stone-500 font-medium mt-1">Update your account credentials to keep your profile secure.</p>
                  </div>

                  <form onSubmit={handleChangePassword} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">Current Password *</label>
                      <input
                        type="password"
                        required
                        placeholder="••••••••"
                        value={passwordForm.current_password}
                        onChange={(e) => setPasswordForm({ ...passwordForm, current_password: e.target.value })}
                        className="w-full px-3.5 py-2.5 bg-stone-50 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">New Password *</label>
                      <input
                        type="password"
                        required
                        placeholder="Min 6 characters"
                        value={passwordForm.new_password}
                        onChange={(e) => setPasswordForm({ ...passwordForm, new_password: e.target.value })}
                        className="w-full px-3.5 py-2.5 bg-stone-50 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">Confirm New Password *</label>
                      <input
                        type="password"
                        required
                        placeholder="Re-type new password"
                        value={passwordForm.confirm_password}
                        onChange={(e) => setPasswordForm({ ...passwordForm, confirm_password: e.target.value })}
                        className="w-full px-3.5 py-2.5 bg-stone-50 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold rounded-lg text-sm transition shadow-sm"

                      Update Password
                    </button>
                  </form>
                </div>

                {/* Supporting Security Information Cards */}
                <div className="max-w-xl w-full mt-6 grid grid-cols-1 sm:grid-cols-3 gap-3 text-center text-xs text-stone-600">
                  <div className="p-3 bg-white rounded-xl border border-orange-200/60 shadow-2xs">
                    <p className="font-bold text-stone-800">🔐 Password Policy</p>

                    <p className="text-[11px] text-stone-500 mt-0.5">HS256 Encrypted Session</p>
                  </div>
                  <div className="p-3 bg-white rounded-xl border border-orange-200/60 shadow-2xs">
                    <p className="font-bold text-stone-800">📍 Active Session</p>
                    <p className="text-[11px] text-stone-500 mt-0.5">Localhost Student Device</p>
                  </div>
                </div>

            {isEditModalOpen && (
              <div className="fixed inset-0 z-50 bg-stone-900/50 backdrop-blur-sm flex items-center justify-center p-4">

                    <button onClick={() => setIsEditModalOpen(false)} className="text-stone-400 hover:text-stone-600 font-bold text-lg">✕</button>
                  </div>

                  <form onSubmit={handleUpdateProfile} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-stone-700 mb-1">Full Name</label>
                      <input
                        type="text"
                        value={editForm.name}
                        onChange={(e) => setEditForm({ ...editForm, name: e.target.value })}

                    <div className="grid grid-cols-2 gap-3">
                      <div>

                          type="tel"

                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-stone-700 mb-1">Date of Birth</label>

                          type="date"
                          value={editForm.dob}

                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-stone-700 mb-1">Department</label>
                        <select
                          value={editForm.department}
                          onChange={(e) => setEditForm({ ...editForm, department: e.target.value })}
                          className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm"

                          <option>Computer Science</option>
                          <option>Information Technology</option>
                          <option>AI & Data Science</option>
                          <option>Electronics & Comm</option>
                          <option>Mechanical Eng</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-stone-700 mb-1">Academic Year</label>
                        <select
                          value={editForm.year}
                          onChange={(e) => setEditForm({ ...editForm, year: e.target.value })}
                          className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm"
                        >
                          <option>1st Year</option>
                          <option>2nd Year</option>
                          <option>3rd Year</option>
                          <option>4th Year</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-stone-700 mb-1">Residential Address</label>
                      <textarea

                    </div>

                    <div className="flex justify-end gap-2 pt-2 border-t border-stone-100">
                      <button
                        type="button"

                      <button
                        type="submit"
