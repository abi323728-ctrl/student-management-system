<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard | NXTLOGIC SMS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: {
              navy: '#0f172a',
              blue: '#2563eb',
              light: '#f8fafc'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
  <div id="root"></div>

  <!-- Shared Auth & API Script -->
  <script src="/static/app.js"></script>

  <!-- React Student Portal Component -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function StudentDashboard() {
      const [student, setStudent] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('overview'); // 'overview' | 'courses' | 'settings'
      const [isEditModalOpen, setIsEditModalOpen] = useState(false);
      const [editForm, setEditForm] = useState({});
      const [passwordForm, setPasswordForm] = useState({ current_password: '', new_password: '', confirm_password: '' });
      const [msg, setMsg] = useState(null);

      useEffect(() => {
        if (!window.auth.requireAuth('student')) return;
        fetchProfile();
      }, []);

      const fetchProfile = async () => {
        try {
          setLoading(true);
          const data = await window.api.getStudentProfile();
          setStudent(data);
          setEditForm({
            name: data.name,
            phone: data.phone || '',
            department: data.department,
            year: data.year,
            address: data.address || '',
            dob: data.dob || ''
          });
        } catch (err) {
          alert('Failed to load student profile: ' + err.message);
          window.auth.logout();
        } finally {
          setLoading(false);
        }
      };

      const handleUpdateProfile = async (e) => {
        e.preventDefault();
        try {
          const updated = await window.api.updateStudentProfile(editForm);
          setStudent(updated);
          setIsEditModalOpen(false);
          setMsg({ type: 'success', text: 'Profile details updated in database successfully!' });
          setTimeout(() => setMsg(null), 4000);
        } catch (err) {
          alert(err.message);
        }
      };

      const handleChangePassword = async (e) => {
        e.preventDefault();
        if (passwordForm.new_password !== passwordForm.confirm_password) {
          alert('New passwords do not match.');
          return;
        }
        try {
          await window.api.changePassword(passwordForm.current_password, passwordForm.new_password);
          setPasswordForm({ current_password: '', new_password: '', confirm_password: '' });
          setMsg({ type: 'success', text: 'Password successfully changed!' });
          setTimeout(() => setMsg(null), 4000);
        } catch (err) {
          alert(err.message);
        }
      };

      if (loading) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-50">
            <div className="animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent"></div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col lg:flex-row">
          {/* Sidebar */}
          <aside className="w-full lg:w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col justify-between">
            <div>
              {/* Brand Header */}
              <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                <img src="/static/nxtlogic-logo.jpg" alt="Logo" className="w-10 h-10 rounded-lg object-cover" />
                <div>
                  <h1 className="font-bold text-white text-base">NXTLOGIC</h1>
                  <span className="text-xs text-blue-400 font-semibold tracking-wider uppercase">Student Portal</span>
                </div>
              </div>

              {/* Navigation Items */}
              <nav className="p-4 space-y-1.5">
                <button
                  onClick={() => setActiveTab('overview')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-semibold transition ${
                    activeTab === 'overview'
                      ? 'bg-blue-600 text-white shadow-sm'
                      : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                  }`}
                >
                  <span>📊</span> Overview & Profile
                </button>
                <button
                  onClick={() => setActiveTab('courses')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-semibold transition ${
                    activeTab === 'courses'
                      ? 'bg-blue-600 text-white shadow-sm'
                      : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                  }`}
                >
                  <span>📚</span> Enrolled Courses ({student?.courses?.length || 0})
                </button>
                <button
                  onClick={() => setActiveTab('settings')}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-semibold transition ${
                    activeTab === 'settings'
                      ? 'bg-blue-600 text-white shadow-sm'
                      : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                  }`}
                >
                  <span>⚙️</span> Security & Password
                </button>
              </nav>
            </div>

            {/* User Info & Logout */}
            <div className="p-4 border-t border-slate-800">
              <div className="flex items-center gap-3 mb-3 p-2 rounded-lg bg-slate-800/60">
                <div className="w-9 h-9 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-sm">
                  {student?.name?.charAt(0) || 'S'}
                </div>
                <div className="overflow-hidden">
                  <p className="text-sm font-semibold text-white truncate">{student?.name}</p>
                  <p className="text-xs text-slate-400 truncate">{student?.student_id}</p>
                </div>
              </div>

              <button
                onClick={() => window.auth.logout()}
                className="w-full py-2 px-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 hover:text-red-300 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-2 border border-red-500/20"
              >
                <span>🚪</span> Sign Out
              </button>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 p-6 lg:p-10 max-w-7xl mx-auto w-full">
            {/* Top Navigation Bar */}
            <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-6 border-b border-slate-200">
              <div>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
                  Welcome, {student?.name}!
                </h2>
                <p className="text-sm text-slate-500 mt-1">
                  Department of {student?.department} • {student?.year}
                </p>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setIsEditModalOpen(true)}
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg shadow-sm transition flex items-center gap-2"
                >
                  <span>✏️</span> Edit Profile
                </button>
              </div>
            </header>

            {/* Notification Banner */}
            {msg && (
              <div className="mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm font-medium flex items-center gap-2">
                <span>✓</span> {msg.text}
              </div>
            )}

            {/* TAB 1: OVERVIEW & PROFILE */}
            {activeTab === 'overview' && (
              <div className="space-y-6">
                {/* Metric Summary Cards */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Cumulative GPA</p>
                    <p className="text-2xl font-extrabold text-blue-600 mt-1">{student?.cgpa?.toFixed(2)} / 10</p>
                    <span className="text-xs text-emerald-600 font-semibold">★ First Class with Distinction</span>
                  </div>

                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Student ID</p>
                    <p className="text-2xl font-extrabold text-slate-800 mt-1">{student?.student_id}</p>
                    <span className="text-xs text-slate-500 font-medium">Official Institutional ID</span>
                  </div>

                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Academic Year</p>
                    <p className="text-2xl font-extrabold text-slate-800 mt-1">{student?.year}</p>
                    <span className="text-xs text-slate-500 font-medium">Regular Student Status</span>
                  </div>

                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Enrolled Courses</p>
                    <p className="text-2xl font-extrabold text-slate-800 mt-1">{student?.courses?.length || 0}</p>
                    <span className="text-xs text-blue-600 font-medium">Current Semester</span>
                  </div>
                </div>

                {/* Personal & Academic Details Grid */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* Personal Information Card */}
                  <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                    <div className="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                      <h3 className="font-bold text-slate-900 text-lg">Personal Information</h3>
                      <button onClick={() => setIsEditModalOpen(true)} className="text-xs text-blue-600 font-semibold hover:underline">
                        Edit Details
                      </button>
                    </div>

                    <dl className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                      <div>
                        <dt className="text-xs font-medium text-slate-500">Full Name</dt>
                        <dd className="font-semibold text-slate-800 mt-0.5">{student?.name}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-medium text-slate-500">Email Address</dt>
                        <dd className="font-semibold text-slate-800 mt-0.5">{student?.email}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-medium text-slate-500">Contact Number</dt>
                        <dd className="font-semibold text-slate-800 mt-0.5">{student?.phone || 'Not provided'}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-medium text-slate-500">Date of Birth</dt>
                        <dd className="font-semibold text-slate-800 mt-0.5">{student?.dob || 'Not provided'}</dd>
                      </div>
                      <div className="sm:col-span-2">
                        <dt className="text-xs font-medium text-slate-500">Residential Address</dt>
                        <dd className="font-semibold text-slate-800 mt-0.5">{student?.address || 'Not provided'}</dd>
                      </div>
                    </dl>
                  </div>

                  {/* Academic Profile Card */}
                  <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                    <div className="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                      <h3 className="font-bold text-slate-900 text-lg">Academic Standing</h3>
                      <span className="px-2.5 py-1 bg-emerald-50 text-emerald-700 text-xs font-bold rounded-full">Active</span>
                    </div>

                    <dl className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                      <div>
                        <dt className="text-xs font-medium text-slate-500">Department</dt>
                        <dd className="font-semibold text-slate-800 mt-0.5">{student?.department}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-medium text-slate-500">Roll Number</dt>
                        <dd className="font-semibold text-slate-800 mt-0.5">{student?.student_id}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-medium text-slate-500">Current Semester/Year</dt>
                        <dd className="font-semibold text-slate-800 mt-0.5">{student?.year}</dd>
                      </div>
                      <div>
                        <dt className="text-xs font-medium text-slate-500">Grading System</dt>
                        <dd className="font-semibold text-slate-800 mt-0.5">10.0 Scale (Choice Based)</dd>
                      </div>
                      <div className="sm:col-span-2 pt-2">
                        <div className="p-3 bg-blue-50 border border-blue-100 rounded-lg">
                          <p className="text-xs text-blue-800 font-semibold">Institutional Standing</p>
                          <p className="text-xs text-blue-600 mt-0.5">Good standing with all prerequisites satisfied.</p>
                        </div>
                      </div>
                    </dl>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: ENROLLED COURSES */}
            {activeTab === 'courses' && (
              <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                  <div>
                    <h3 className="text-lg font-bold text-slate-900">Current Semester Enrolled Courses</h3>
                    <p className="text-xs text-slate-500 mt-0.5">Academic coursework and earned credits</p>
                  </div>
                  <span className="text-xs font-semibold text-slate-600 bg-slate-100 px-3 py-1 rounded-full">
                    Total Credits: {student?.courses?.reduce((acc, c) => acc + c.credits, 0) || 0}
                  </span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm text-slate-700">
                    <thead className="bg-slate-50 text-xs uppercase font-bold text-slate-500 border-b border-slate-200">
                      <tr>
                        <th className="px-6 py-3.5">Course Code</th>
                        <th className="px-6 py-3.5">Course Title</th>
                        <th className="px-6 py-3.5">Semester</th>
                        <th className="px-6 py-3.5">Credits</th>
                        <th className="px-6 py-3.5">Grade</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {student?.courses?.map((c) => (
                        <tr key={c.id} className="hover:bg-slate-50/80 transition">
                          <td className="px-6 py-4 font-bold text-blue-600">{c.course_code}</td>
                          <td className="px-6 py-4 font-semibold text-slate-900">{c.course_name}</td>
                          <td className="px-6 py-4 text-slate-500">{c.semester}</td>
                          <td className="px-6 py-4">{c.credits} Credits</td>
                          <td className="px-6 py-4">
                            <span className="px-2.5 py-1 bg-emerald-100 text-emerald-800 font-bold rounded text-xs">
                              {c.grade}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB 3: SETTINGS & PASSWORD */}
            {activeTab === 'settings' && (
              <div className="max-w-xl bg-white rounded-xl border border-slate-200 shadow-sm p-6 sm:p-8">
                <h3 className="text-lg font-bold text-slate-900 mb-1">Security & Change Password</h3>
                <p className="text-xs text-slate-500 mb-6">Update your account credentials to keep your profile secure.</p>

                <form onSubmit={handleChangePassword} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1.5">Current Password *</label>
                    <input
                      type="password"
                      required
                      placeholder="••••••••"
                      value={passwordForm.current_password}
                      onChange={(e) => setPasswordForm({ ...passwordForm, current_password: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1.5">New Password *</label>
                    <input
                      type="password"
                      required
                      placeholder="Min 6 characters"
                      value={passwordForm.new_password}
                      onChange={(e) => setPasswordForm({ ...passwordForm, new_password: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1.5">Confirm New Password *</label>
                    <input
                      type="password"
                      required
                      placeholder="Re-type new password"
                      value={passwordForm.confirm_password}
                      onChange={(e) => setPasswordForm({ ...passwordForm, confirm_password: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-sm transition shadow-sm"
                  >
                    Update Password
                  </button>
                </form>
              </div>
            )}

            {/* EDIT PROFILE MODAL */}
            {isEditModalOpen && (
              <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200">
                  <div className="flex justify-between items-center pb-4 border-b border-slate-100 mb-4">
                    <h3 className="font-bold text-lg text-slate-900">Edit Student Details</h3>
                    <button onClick={() => setIsEditModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                  </div>

                  <form onSubmit={handleUpdateProfile} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
                      <input
                        type="text"
                        value={editForm.name}
                        onChange={(e) => setEditForm({ ...editForm, name: e.target.value })}
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Phone</label>
                        <input
                          type="tel"
                          value={editForm.phone}
                          onChange={(e) => setEditForm({ ...editForm, phone: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Date of Birth</label>
                        <input
                          type="date"
                          value={editForm.dob}
                          onChange={(e) => setEditForm({ ...editForm, dob: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Department</label>
                        <select
                          value={editForm.department}
                          onChange={(e) => setEditForm({ ...editForm, department: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                        >
                          <option>Computer Science</option>
                          <option>Information Technology</option>
                          <option>AI & Data Science</option>
                          <option>Electronics & Comm</option>
                          <option>Mechanical Eng</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Academic Year</label>
                        <select
                          value={editForm.year}
                          onChange={(e) => setEditForm({ ...editForm, year: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                        >
                          <option>1st Year</option>
                          <option>2nd Year</option>
                          <option>3rd Year</option>
                          <option>4th Year</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Residential Address</label>
                      <textarea
                        rows="2"
                        value={editForm.address}
                        onChange={(e) => setEditForm({ ...editForm, address: e.target.value })}
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
                      ></textarea>
                    </div>

                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsEditModalOpen(false)}
                        className="px-4 py-2 border border-slate-300 rounded-lg text-sm text-slate-700 hover:bg-slate-50 font-semibold"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold shadow-sm"
                      >
                        Save Changes
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StudentDashboard />);
  </script>
</body>
</html>
