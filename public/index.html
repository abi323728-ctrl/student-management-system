<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NXTLOGIC | Student Management System Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: {
              orange: '#ea580c',
              amber: '#f97316',
              light: '#fff7ed',
              border: '#fed7aa',
              dark: '#7c2d12'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; }
    .auth-warm-glow {
      box-shadow: 
        0 0 70px 18px rgba(251, 146, 60, 0.28),
        0 0 130px 45px rgba(254, 215, 170, 0.35),
        0 20px 40px -10px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body class="bg-white text-slate-800 min-h-screen flex items-center justify-center p-4 antialiased">
  <div id="root" class="w-full max-w-5xl"></div>

  <!-- Shared Auth & API Script -->
  <script src="/static/app.js"></script>

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function AuthApp() {
      const [activeTab, setActiveTab] = useState('student-login'); // 'student-login' | 'student-register' | 'admin-login'
      const [loading, setLoading] = useState(false);
      const [alert, setAlert] = useState(null);
      const [showPassword, setShowPassword] = useState(false);

      // Student Login State
      const [studentLogin, setStudentLogin] = useState({ email: '', password: '' });

      // Student Register State
      const [studentReg, setStudentReg] = useState({
        name: '',
        student_id: '',
        email: '',
        phone: '',
        department: 'Computer Science',
        year: '1st Year',
        password: '',
        confirm_password: ''
      });

      // Admin Login State
      const [adminLogin, setAdminLogin] = useState({ email: '', password: '' });

      useEffect(() => {
        const token = window.auth.getToken();
        const role = window.auth.getRole();
        if (token && role === 'admin') window.location.href = '/admin';
        if (token && role === 'student') window.location.href = '/student';
      }, []);

      const showAlert = (message, type = 'error') => {
        setAlert({ message, type });
      };

      const handleStudentLogin = async (e) => {
        e.preventDefault();
        setAlert(null);
        if (!studentLogin.email || !studentLogin.password) {
          showAlert('Please enter both email and password.');
          return;
        }

        setLoading(true);
        try {
          const res = await window.api.loginStudent(studentLogin.email, studentLogin.password);
          window.auth.setSession(res.access_token, res.role, res.user);
          showAlert('Login successful! Redirecting to Student Dashboard...', 'success');
          setTimeout(() => { window.location.href = '/student'; }, 800);
        } catch (err) {
          showAlert(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleStudentRegister = async (e) => {
        e.preventDefault();
        setAlert(null);

        if (!studentReg.name || !studentReg.student_id || !studentReg.email || !studentReg.password) {
          showAlert('Please fill in all required fields.');
          return;
        }
        if (studentReg.password.length < 6) {
          showAlert('Password must be at least 6 characters long.');
          return;
        }
        if (studentReg.password !== studentReg.confirm_password) {
          showAlert('Passwords do not match.');
          return;
        }

        setLoading(true);
        try {
          const res = await window.api.registerStudent({
            name: studentReg.name,
            student_id: studentReg.student_id,
            email: studentReg.email,
            phone: studentReg.phone,
            department: studentReg.department,
            year: studentReg.year,
            password: studentReg.password
          });
          window.auth.setSession(res.access_token, res.role, res.user);
          showAlert('Registration successful! Redirecting to Student Dashboard...', 'success');
          setTimeout(() => { window.location.href = '/student'; }, 1000);
        } catch (err) {
          showAlert(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleAdminLogin = async (e) => {
        e.preventDefault();
        setAlert(null);
        if (!adminLogin.email || !adminLogin.password) {
          showAlert('Please enter administrator email and password.');
          return;
        }

        setLoading(true);
        try {
          const res = await window.api.loginAdmin(adminLogin.email, adminLogin.password);
          window.auth.setSession(res.access_token, res.role, res.user);
          showAlert('Admin authentication verified! Redirecting...', 'success');
          setTimeout(() => { window.location.href = '/admin'; }, 800);
        } catch (err) {
          showAlert(err.message);
        } finally {
          setLoading(false);
        }
      };

      const fillStudentDemo = () => {
        setStudentLogin({ email: 'student@nxtlogic.com', password: 'Student@2026' });
        setAlert(null);
      };

      const fillAdminDemo = () => {
        setAdminLogin({ email: 'admin@nxtlogic.com', password: 'Admin@2026' });
        setAlert(null);
      };

      return (
        <div className="bg-white rounded-2xl border border-orange-200/80 auth-warm-glow overflow-hidden grid grid-cols-1 lg:grid-cols-12 min-h-[620px]">
          {/* Left Column: Signature Warm Peach / Sunset Brand Showcase */}
          <div className="lg:col-span-5 bg-gradient-to-br from-[#fff7ed] via-[#ffedd5] to-[#fed7aa] border-r border-[#fed7aa] p-8 sm:p-10 flex flex-col justify-between">
            <div>
              {/* Header Branding */}
              <div className="flex items-center gap-3 mb-6">
                <div className="w-11 h-11 rounded-full bg-white border border-[#fed7aa] flex items-center justify-center p-0.5 overflow-hidden shadow-sm">
                  <img src="/static/nxtlogic-logo.jpg" alt="NXTLOGIC" className="w-full h-full object-cover rounded-full" />
                </div>
                <div>
                  <span className="text-[11px] font-extrabold tracking-wider uppercase text-[#c2410c]">NXTLOGIC PORTAL</span>
                  <h2 className="text-base font-bold text-[#7c2d12] leading-tight">Student Management</h2>
                </div>
              </div>

              <h1 className="text-2xl sm:text-3xl font-extrabold text-[#7c2d12] leading-snug mb-3">
                NXTLOGIC User Login
              </h1>
              <p className="text-sm text-[#9a3412] leading-relaxed mb-6 font-medium">
                Access your internship workspace, tools, and client project dashboards securely.
              </p>

              {/* Feature Checklist */}
              <div className="space-y-3 mb-8">
                <div className="flex items-center gap-3 text-sm text-[#7c2d12] font-semibold">
                  <div className="w-5 h-5 rounded-full bg-[#ea580c] flex items-center justify-center text-white text-xs">✓</div>
                  <span>Interactive real-time field validation</span>
                </div>
                <div className="flex items-center gap-3 text-sm text-[#7c2d12] font-semibold">
                  <div className="w-5 h-5 rounded-full bg-[#ea580c] flex items-center justify-center text-white text-xs">✓</div>
                  <span>Enhanced password security rules</span>
                </div>
                <div className="flex items-center gap-3 text-sm text-[#7c2d12] font-semibold">
                  <div className="w-5 h-5 rounded-full bg-[#ea580c] flex items-center justify-center text-white text-xs">✓</div>
                  <span>Seamless localhost server integration</span>
                </div>
              </div>
            </div>

            {/* Showcase Box Matching Exact User Image */}
            <div className="bg-white/80 border border-[#fed7aa] rounded-2xl p-4 flex flex-col items-center justify-center shadow-sm">
              <img src="/static/nxtlogic-logo.jpg" alt="NXTLOGIC Logo" className="w-28 h-28 rounded-full border-2 border-white shadow-md object-cover mb-2" />
              <p className="text-xs font-bold text-[#c2410c] tracking-wide">www.nxtlogic.com</p>
            </div>

            <div className="mt-6 pt-4 border-t border-[#fed7aa]/60 text-xs text-[#c2410c] font-medium text-center sm:text-left">
              © 2026 NXTLOGIC Inc. All rights reserved.
            </div>
          </div>

          {/* Right Column: Clean White Form with Warm Sunset Accents */}
          <div className="lg:col-span-7 p-6 sm:p-10 flex flex-col justify-center bg-white">
            {/* Tab Navigation */}
            <div className="flex p-1 bg-[#fff7ed] rounded-xl mb-6 border border-[#fed7aa]">
              <button
                type="button"
                onClick={() => { setActiveTab('student-login'); setAlert(null); }}
                className={`flex-1 py-2.5 px-3 text-xs sm:text-sm font-bold rounded-lg transition-all ${
                  activeTab === 'student-login'
                    ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-sm'
                    : 'text-[#9a3412] hover:text-[#7c2d12]'
                }`}
              >
                Student Login
              </button>
              <button
                type="button"
                onClick={() => { setActiveTab('student-register'); setAlert(null); }}
                className={`flex-1 py-2.5 px-3 text-xs sm:text-sm font-bold rounded-lg transition-all ${
                  activeTab === 'student-register'
                    ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-sm'
                    : 'text-[#9a3412] hover:text-[#7c2d12]'
                }`}
              >
                Register
              </button>
              <button
                type="button"
                onClick={() => { setActiveTab('admin-login'); setAlert(null); }}
                className={`flex-1 py-2.5 px-3 text-xs sm:text-sm font-bold rounded-lg transition-all ${
                  activeTab === 'admin-login'
                    ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-sm'
                    : 'text-[#9a3412] hover:text-[#7c2d12]'
                }`}
              >
                Admin Portal
              </button>
            </div>

            {/* Alert Message Banner */}
            {alert && (
              <div className={`mb-5 p-3.5 rounded-lg text-sm flex items-center gap-2.5 border ${
                alert.type === 'success' 
                  ? 'bg-emerald-50 text-emerald-800 border-emerald-200' 
                  : 'bg-rose-50 text-rose-800 border-rose-200'
              }`}>
                <span>{alert.type === 'success' ? '✓' : '⚠'}</span>
                <span className="font-semibold">{alert.message}</span>
              </div>
            )}

            {/* TAB 1: Student Login */}
            {activeTab === 'student-login' && (
              <div>
                <div className="mb-6">
                  <h2 className="text-xl font-bold text-slate-900">Welcome back</h2>
                  <p className="text-sm text-slate-500">Please enter your details to sign in.</p>
                </div>

                <form onSubmit={handleStudentLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                      Email address <span className="text-rose-500">*</span>
                    </label>
                    <input
                      type="email"
                      required
                      placeholder="e.g. intern@nxtlogic.com"
                      value={studentLogin.email}
                      onChange={(e) => setStudentLogin({ ...studentLogin, email: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 focus:bg-white transition"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1.5">
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider">
                        Password <span className="text-rose-500">*</span>
                      </label>
                      <button type="button" onClick={() => setShowPassword(!showPassword)} className="text-xs text-orange-600 font-semibold hover:underline">
                        {showPassword ? 'Hide' : 'Show'}
                      </button>
                    </div>
                    <input
                      type={showPassword ? 'text' : 'password'}
                      required
                      placeholder="Enter your password"
                      value={studentLogin.password}
                      onChange={(e) => setStudentLogin({ ...studentLogin, password: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 focus:bg-white transition"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full py-3 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold rounded-lg shadow-sm hover:shadow transition-all disabled:opacity-60 flex items-center justify-center gap-2"
                  >
                    {loading ? 'Authenticating...' : 'Sign In'}
                  </button>
                </form>

                {/* Demo autofill */}
                <div className="mt-5 p-3 bg-[#fff7ed] border border-[#fed7aa] rounded-lg flex items-center justify-between">
                  <div className="text-xs text-[#7c2d12]">
                    <span className="font-bold">NXTLOGIC Demo Account:</span> student@nxtlogic.com
                  </div>
                  <button
                    type="button"
                    onClick={fillStudentDemo}
                    className="text-xs px-2.5 py-1 bg-white border border-[#fed7aa] rounded text-orange-600 hover:bg-orange-50 font-bold transition shadow-xs"
                  >
                    Autofill Test Credentials
                  </button>
                </div>
              </div>
            )}

            {/* TAB 2: Student Registration */}
            {activeTab === 'student-register' && (
              <div>
                <div className="mb-5">
                  <h2 className="text-xl font-bold text-slate-900">Student Registration</h2>
                  <p className="text-sm text-slate-500">Create your new institutional student account.</p>
                </div>

                <form onSubmit={handleStudentRegister} className="space-y-3.5">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Full Name *</label>
                      <input
                        type="text"
                        required
                        placeholder="John Doe"
                        value={studentReg.name}
                        onChange={(e) => setStudentReg({ ...studentReg, name: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Roll No / Student ID *</label>
                      <input
                        type="text"
                        required
                        placeholder="NXT202610"
                        value={studentReg.student_id}
                        onChange={(e) => setStudentReg({ ...studentReg, student_id: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Email Address *</label>
                      <input
                        type="email"
                        required
                        placeholder="name@nxtlogic.com"
                        value={studentReg.email}
                        onChange={(e) => setStudentReg({ ...studentReg, email: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Phone Number</label>
                      <input
                        type="tel"
                        placeholder="+91 9876543210"
                        value={studentReg.phone}
                        onChange={(e) => setStudentReg({ ...studentReg, phone: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Department</label>
                      <select
                        value={studentReg.department}
                        onChange={(e) => setStudentReg({ ...studentReg, department: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                      >
                        <option>Computer Science</option>
                        <option>Information Technology</option>
                        <option>AI & Data Science</option>
                        <option>Electronics & Comm</option>
                        <option>Mechanical Eng</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Academic Year</label>
                      <select
                        value={studentReg.year}
                        onChange={(e) => setStudentReg({ ...studentReg, year: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                      >
                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Password *</label>
                      <input
                        type="password"
                        required
                        placeholder="Min 6 characters"
                        value={studentReg.password}
                        onChange={(e) => setStudentReg({ ...studentReg, password: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Confirm Password *</label>
                      <input
                        type="password"
                        required
                        placeholder="Re-type password"
                        value={studentReg.confirm_password}
                        onChange={(e) => setStudentReg({ ...studentReg, confirm_password: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full py-2.5 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold rounded-lg shadow-sm hover:shadow transition-all disabled:opacity-60 text-sm"
                  >
                    {loading ? 'Creating Student Account...' : 'Complete Registration'}
                  </button>
                </form>
              </div>
            )}

            {/* TAB 3: Admin Login */}
            {activeTab === 'admin-login' && (
              <div>
                <div className="mb-6">
                  <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded bg-[#fff7ed] text-[#c2410c] text-xs font-bold border border-[#fed7aa] mb-2">
                    🔒 Protected Administrative Portal
                  </div>
                  <h2 className="text-xl font-bold text-slate-900">Administrator Sign In</h2>
                  <p className="text-sm text-slate-500">Manage student records, perform CRUD operations, and oversee system metrics.</p>
                </div>

                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                      Admin Email <span className="text-rose-500">*</span>
                    </label>
                    <input
                      type="email"
                      required
                      placeholder="admin@nxtlogic.com"
                      value={adminLogin.email}
                      onChange={(e) => setAdminLogin({ ...adminLogin, email: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 focus:bg-white transition"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1.5">
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider">
                        Master Password <span className="text-rose-500">*</span>
                      </label>
                      <button type="button" onClick={() => setShowPassword(!showPassword)} className="text-xs text-orange-600 font-semibold hover:underline">
                        {showPassword ? 'Hide' : 'Show'}
                      </button>
                    </div>
                    <input
                      type={showPassword ? 'text' : 'password'}
                      required
                      placeholder="Enter administrator password"
                      value={adminLogin.password}
                      onChange={(e) => setAdminLogin({ ...adminLogin, password: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 focus:bg-white transition"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full py-3 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold rounded-lg shadow-sm hover:shadow transition-all disabled:opacity-60 flex items-center justify-center gap-2"
                  >
                    {loading ? 'Authenticating Admin...' : 'Sign In as Administrator'}
                  </button>
                </form>

                {/* Demo autofill */}
                <div className="mt-5 p-3 bg-[#fff7ed] border border-[#fed7aa] rounded-lg flex items-center justify-between">
                  <div className="text-xs text-[#7c2d12]">
                    <span className="font-bold">Admin Account:</span> admin@nxtlogic.com
                  </div>
                  <button
                    type="button"
                    onClick={fillAdminDemo}
                    className="text-xs px-2.5 py-1 bg-white border border-[#fed7aa] rounded text-orange-600 hover:bg-orange-50 font-bold transition shadow-xs"
                  >
                    Autofill Admin Demo
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AuthApp />);
  </script>
</body>
</html>
