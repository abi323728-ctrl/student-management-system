<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMPUSCORE | Connecting Campus. Empowering Futures.</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: {
              orange: '#ea580c',
              amber: '#f97316',
              light: '#fff7ed',
              border: '#fed7aa',
              dark: '#7c2d12'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; }
    .card-warm-glow {
      box-shadow: 
        0 0 70px 18px rgba(251, 146, 60, 0.28),
        0 0 130px 45px rgba(254, 215, 170, 0.35),
        0 20px 40px -10px rgba(0, 0, 0, 0.06);
    }
    .logo-hero-glow {
      box-shadow: 
        0 0 50px 15px rgba(251, 146, 60, 0.35),
        0 15px 35px -5px rgba(0, 0, 0, 0.1);
    }
    .portal-card-hover {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .portal-card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 28px -6px rgba(234, 88, 12, 0.18);
    }
    .fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col justify-between antialiased selection:bg-orange-100 selection:text-orange-900">
  
  <div id="root"></div>

  <!-- Shared Auth & API Script -->
  <script src="/static/app.js"></script>

  <!-- React 2-Page App: Page 1 (Main Dashboard) & Page 2 (Inside Portal / Auth) -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Navigation: 'dashboard' (Page 1) or 'portal' (Page 2)
      const [currentPage, setCurrentPage] = useState('dashboard');
      // Sub-tabs on Page 2: 'student-login' | 'student-register' | 'admin-login'
      const [activeTab, setActiveTab] = useState('student-login');

      const [loading, setLoading] = useState(false);
      const [alert, setAlert] = useState(null);
      const [showPassword, setShowPassword] = useState(false);
      const [session, setSession] = useState({ token: null, role: null, user: null });
      const [stats, setStats] = useState({ total_students: 1248, departments: 5, avg_cgpa: '8.72', placement: '98.4%' });

      // Student Login State
      const [studentLogin, setStudentLogin] = useState({ email: '', password: '' });

      // Student Register State
      const [studentReg, setStudentReg] = useState({
        name: '',
        student_id: '',
        email: '',
        phone: '',
        department: 'Computer Science',
        year: '1st Year',
        password: '',
        confirm_password: ''
      });

      // Admin Login State
      const [adminLogin, setAdminLogin] = useState({ email: '', password: '' });

      // Sync with URL hash for seamless page/tab switching
      useEffect(() => {
        const handleHash = () => {
          const hash = window.location.hash;
          if (hash === '#student-login') {
            setCurrentPage('portal');
            setActiveTab('student-login');
          } else if (hash === '#register' || hash === '#student-register') {
            setCurrentPage('portal');
            setActiveTab('student-register');
          } else if (hash === '#admin-login' || hash === '#admin-control') {
            setCurrentPage('portal');
            setActiveTab('admin-login');
          } else if (hash === '#portal') {
            setCurrentPage('portal');
          } else {
            setCurrentPage('dashboard');
          }
        };

        handleHash();
        window.addEventListener('hashchange', handleHash);

        // Check active session
        const token = window.auth.getToken();
        const role = window.auth.getRole();
        const user = window.auth.getUser();
        if (token && role) {
          setSession({ token, role, user });
        }

        // Live stats fetch
        fetch('/api/admin/stats', {
          headers: token ? { 'Authorization': `Bearer ${token}` } : {}
        })
        .then(res => res.ok ? res.json() : null)
        .then(data => {
          if (data && data.total_students !== undefined) {
            setStats(prev => ({
              ...prev,
              total_students: data.total_students,
              departments: Object.keys(data.department_breakdown || {}).length || 5,
              avg_cgpa: (data.average_cgpa || 8.72).toFixed(2)
            }));
          }
        })
        .catch(() => {});

        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      const navigateTo = (page, tab = null) => {
        setCurrentPage(page);
        if (tab) setActiveTab(tab);
        setAlert(null);
        if (page === 'dashboard') {
          window.location.hash = '';
        } else {
          window.location.hash = tab || 'portal';
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const showAlert = (message, type = 'error') => {
        setAlert({ message, type });
      };

      const handleStudentLogin = async (e) => {
        e.preventDefault();
        setAlert(null);
        if (!studentLogin.email || !studentLogin.password) {
          showAlert('Please enter both student email and password.');
          return;
        }

        setLoading(true);
        try {
          const res = await window.api.loginStudent(studentLogin.email, studentLogin.password);
          window.auth.setSession(res.access_token, res.role, res.user);
          showAlert('Login successful! Redirecting to Student Dashboard...', 'success');
          setTimeout(() => { window.location.href = '/student'; }, 700);
        } catch (err) {
          showAlert(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleStudentRegister = async (e) => {
        e.preventDefault();
        setAlert(null);

        if (!studentReg.name || !studentReg.student_id || !studentReg.email || !studentReg.password) {
          showAlert('Please fill in all required registration fields.');
          return;
        }
        if (studentReg.password.length < 6) {
          showAlert('Password must be at least 6 characters long.');
          return;
        }
        if (studentReg.password !== studentReg.confirm_password) {
          showAlert('Passwords do not match.');
          return;
        }

        setLoading(true);
        try {
          const res = await window.api.registerStudent({
            name: studentReg.name,
            student_id: studentReg.student_id,
            email: studentReg.email,
            phone: studentReg.phone,
            department: studentReg.department,
            year: studentReg.year,
            password: studentReg.password
          });
          window.auth.setSession(res.access_token, res.role, res.user);
          showAlert('Registration successful! Redirecting to Student Dashboard...', 'success');
          setTimeout(() => { window.location.href = '/student'; }, 800);
        } catch (err) {
          showAlert(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleAdminLogin = async (e) => {
        e.preventDefault();
        setAlert(null);
        if (!adminLogin.email || !adminLogin.password) {
          showAlert('Please enter administrator email and password.');
          return;
        }

        setLoading(true);
        try {
          const res = await window.api.loginAdmin(adminLogin.email, adminLogin.password);
          window.auth.setSession(res.access_token, res.role, res.user);
          showAlert('Admin verified! Redirecting to Management Console...', 'success');
          setTimeout(() => { window.location.href = '/admin'; }, 700);
        } catch (err) {
          showAlert(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* ========================================================
              ACTIVE LOGGED-IN SESSION BANNER (IF SIGNED IN)
             ======================================================== */}
          {session.token && (
            <div className="bg-[#fff7ed] border-b border-[#fed7aa] px-4 sm:px-8 py-2 text-xs text-[#7c2d12] flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Active Session: <strong>{session.user?.name || session.role}</strong> ({session.role.toUpperCase()})</span>
              </div>
              <div className="flex items-center gap-3">
                <a
                  href={session.role === 'admin' ? '/admin' : '/student'}
                  className="font-bold text-orange-600 hover:text-orange-700 underline"
                >
                  Enter {session.role === 'admin' ? 'Admin Console' : 'Student Portal'} →
                </a>
                <button
                  onClick={() => window.auth.logout()}
                  className="text-stone-500 hover:text-rose-600 font-semibold"
                >
                  Sign Out
                </button>
              </div>
            </div>
          )}

          {/* ========================================================
              TOP NAVIGATION BAR
             ======================================================== */}
          <nav className="border-b border-[#fed7aa]/70 bg-white/95 backdrop-blur-md sticky top-0 z-50 px-4 sm:px-8 py-3.5 flex items-center justify-between">
            <div 
              onClick={() => navigateTo('dashboard')}
              className="flex items-center gap-3 cursor-pointer group"
            >
              <img
                src="/static/campuscore-logo.png"
                alt="CAMPUSCORE Emblem"
                className="w-10 h-10 rounded-full border border-orange-400 object-cover shadow-xs bg-white group-hover:scale-105 transition"
              />
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-extrabold text-stone-900 tracking-tight text-base sm:text-lg">CAMPUSCORE</span>
                  <span className="hidden sm:inline-block text-[10px] font-extrabold uppercase tracking-wider text-orange-700 bg-[#fff7ed] px-2 py-0.5 rounded-full border border-[#fed7aa]">
                    Digital Campus Platform
                  </span>
                </div>
                <p className="text-[10px] text-stone-500 font-medium hidden md:block">Connecting Campus. Empowering Futures.</p>
              </div>
            </div>

            {/* Page Navigation Switcher */}
            <div className="flex items-center gap-1 sm:gap-2">
              <button
                onClick={() => navigateTo('dashboard')}
                className={`px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg transition ${
                  currentPage === 'dashboard'
                    ? 'bg-[#fff7ed] text-[#7c2d12] border border-[#fed7aa]'
                    : 'text-stone-600 hover:text-orange-600'
                }`}
              >
                🏠 Main Dashboard
              </button>

              <button
                onClick={() => navigateTo('portal', 'student-login')}
                className={`px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg transition ${
                  currentPage === 'portal' && activeTab === 'student-login'
                    ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-xs'
                    : 'text-stone-600 hover:text-orange-600'
                }`}
              >
                🎓 Student Login
              </button>

              <button
                onClick={() => navigateTo('portal', 'student-register')}
                className={`hidden md:block px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg transition ${
                  currentPage === 'portal' && activeTab === 'student-register'
                    ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-xs'
                    : 'text-stone-600 hover:text-orange-600'
                }`}
              >
                📝 Register
              </button>

              <button
                onClick={() => navigateTo('portal', 'admin-login')}
                className={`px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg transition ${
                  currentPage === 'portal' && activeTab === 'admin-login'
                    ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-xs'
                    : 'text-stone-600 hover:text-orange-600'
                }`}
              >
                🛡️ Admin Control
              </button>
            </div>
          </nav>

          {/* ========================================================
              PAGE 1: MAIN CAMPUS DASHBOARD
              (Shown first without long scroll)
             ======================================================== */}
          {currentPage === 'dashboard' && (
            <main className="flex-1 px-4 sm:px-6 py-10 max-w-6xl mx-auto w-full fade-in">
              
              {/* Hero Banner Section */}
              <div className="text-center pt-2 pb-8">
                {/* Large Official CAMPUSCORE Symbol */}
                <div className="inline-block relative mb-5">
                  <div className="p-2 rounded-full bg-gradient-to-tr from-orange-400 via-amber-200 to-orange-500 logo-hero-glow">
                    <img
                      src="/static/campuscore-logo.png"
                      alt="CAMPUSCORE Official Symbol"
                      className="w-40 h-40 sm:w-48 sm:h-48 rounded-full border-4 border-white object-cover mx-auto bg-white"
                    />
                  </div>
                  <div className="absolute -bottom-3 inset-x-0 flex justify-center">
                    <span className="bg-[#fff7ed] text-[#c2410c] text-[11px] sm:text-xs font-black uppercase tracking-widest px-4 py-1 rounded-full border border-[#fed7aa] shadow-xs">
                      Primary Campus Hub
                    </span>
                  </div>
                </div>

                {/* Title & Official Slogan */}
                <h1 className="text-3xl sm:text-5xl font-black text-[#7c2d12] tracking-tight mb-2 mt-4">
                  CAMPUSCORE
                </h1>
                
                <div className="inline-block mb-4">
                  <p className="text-xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-600 via-amber-600 to-orange-500 tracking-tight">
                    “Connecting Campus. Empowering Futures.”
                  </p>
                </div>

                <p className="text-sm sm:text-base text-stone-600 max-w-2xl mx-auto leading-relaxed mb-8">
                  Welcome to the official institutional student management system. Seamlessly connect with your academic records, track course milestones, or administer college operations through dedicated portals.
                </p>

                {/* Page 1 Action Button to Go Inside */}
                <div className="flex flex-wrap items-center justify-center gap-3">
                  <button
                    onClick={() => navigateTo('portal', 'student-login')}
                    className="px-6 py-3 rounded-xl bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-extrabold text-sm sm:text-base shadow-md hover:shadow-lg transition flex items-center gap-2 group"
                  >
                    <span>Proceed to Portals & Sign In</span>
                    <span className="group-hover:translate-x-1 transition-transform">→</span>
                  </button>
                </div>
              </div>

              {/* 3 Interactive Gateway Cards (Page 1 -> Page 2) */}
              <div className="mb-12">
                <div className="text-center mb-6">
                  <h2 className="text-xl sm:text-2xl font-black text-stone-900">Dedicated Portal Gateways</h2>
                  <p className="text-xs sm:text-sm text-stone-500">Select your destination module to access credentials or admission</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                  
                  {/* Gateway 1: Student Login */}
                  <div 
                    onClick={() => navigateTo('portal', 'student-login')}
                    className="p-6 rounded-2xl bg-gradient-to-b from-white to-[#fff7ed]/50 border-2 border-[#fed7aa] portal-card-hover cursor-pointer flex flex-col justify-between"
                  >
                    <div>
                      <div className="w-12 h-12 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center text-2xl mb-4 border border-[#fed7aa]">
                        🎓
                      </div>
                      <span className="text-[10px] font-extrabold uppercase tracking-widest text-[#c2410c] bg-orange-100/60 px-2 py-0.5 rounded">Module 1</span>
                      <h3 className="text-lg font-black text-[#7c2d12] mt-2 mb-1.5">Student Login</h3>
                      <p className="text-xs text-stone-600 leading-relaxed mb-4">
                        Access personal profiles, enrolled course grades, CGPA performance, and download academic credentials.
                      </p>
                    </div>
                    <div className="pt-3 border-t border-[#fed7aa]/60 flex items-center justify-between text-xs font-bold text-orange-600">
                      <span>Open Student Login</span>
                      <span>→</span>
                    </div>
                  </div>

                  {/* Gateway 2: Student Registration */}
                  <div 
                    onClick={() => navigateTo('portal', 'student-register')}
                    className="p-6 rounded-2xl bg-gradient-to-b from-white to-[#fff7ed]/50 border-2 border-[#fed7aa] portal-card-hover cursor-pointer flex flex-col justify-between"
                  >
                    <div>
                      <div className="w-12 h-12 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-2xl mb-4 border border-[#fed7aa]">
                        📝
                      </div>
                      <span className="text-[10px] font-extrabold uppercase tracking-widest text-amber-800 bg-amber-100/60 px-2 py-0.5 rounded">Admissions</span>
                      <h3 className="text-lg font-black text-[#7c2d12] mt-2 mb-1.5">Student Registration</h3>
                      <p className="text-xs text-stone-600 leading-relaxed mb-4">
                        New admission portal. Instant enrollment with automated Student ID assignment, department, and academic year.
                      </p>
                    </div>
                    <div className="pt-3 border-t border-[#fed7aa]/60 flex items-center justify-between text-xs font-bold text-orange-600">
                      <span>Open Registration</span>
                      <span>→</span>
                    </div>
                  </div>

                  {/* Gateway 3: Admin Control */}
                  <div 
                    onClick={() => navigateTo('portal', 'admin-login')}
                    className="p-6 rounded-2xl bg-gradient-to-b from-white to-[#fff7ed]/50 border-2 border-[#fed7aa] portal-card-hover cursor-pointer flex flex-col justify-between"
                  >
                    <div>
                      <div className="w-12 h-12 rounded-xl bg-stone-100 text-stone-800 flex items-center justify-center text-2xl mb-4 border border-[#fed7aa]">
                        🛡️
                      </div>
                      <span className="text-[10px] font-extrabold uppercase tracking-widest text-[#7c2d12] bg-stone-200/60 px-2 py-0.5 rounded">Module 2</span>
                      <h3 className="text-lg font-black text-[#7c2d12] mt-2 mb-1.5">Admin Control Center</h3>
                      <p className="text-xs text-stone-600 leading-relaxed mb-4">
                        Master management console. Full CRUD operations over student records, live search, department filters, and stats.
                      </p>
                    </div>
                    <div className="pt-3 border-t border-[#fed7aa]/60 flex items-center justify-between text-xs font-bold text-orange-600">
                      <span>Access Admin Console</span>
                      <span>→</span>
                    </div>
                  </div>

                </div>
              </div>

              {/* Live Campus Metrics Overview */}
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-12">
                <div className="p-4 rounded-xl bg-[#fff7ed] border border-[#fed7aa]">
                  <p className="text-xs font-bold text-[#c2410c] uppercase">Active Students</p>
                  <p className="text-2xl font-black text-[#7c2d12] mt-0.5">{stats.total_students}</p>
                  <p className="text-[11px] text-[#9a3412] font-semibold">Enrolled in Database</p>
                </div>
                <div className="p-4 rounded-xl bg-[#fff7ed] border border-[#fed7aa]">
                  <p className="text-xs font-bold text-[#c2410c] uppercase">Departments</p>
                  <p className="text-2xl font-black text-[#7c2d12] mt-0.5">{stats.departments}</p>
                  <p className="text-[11px] text-[#9a3412] font-semibold">Active Engineering Wings</p>
                </div>
                <div className="p-4 rounded-xl bg-[#fff7ed] border border-[#fed7aa]">
                  <p className="text-xs font-bold text-[#c2410c] uppercase">Curriculum</p>
                  <p className="text-2xl font-black text-[#7c2d12] mt-0.5">{stats.avg_cgpa}</p>
                  <p className="text-[11px] text-[#9a3412] font-semibold">10.0 CGPA CBCS Scale</p>
                </div>
                <div className="p-4 rounded-xl bg-[#fff7ed] border border-[#fed7aa]">
                  <p className="text-xs font-bold text-[#c2410c] uppercase">Placement Rate</p>
                  <p className="text-2xl font-black text-[#7c2d12] mt-0.5">{stats.placement}</p>
                  <p className="text-[11px] text-[#9a3412] font-semibold">Graduating Success Index</p>
                </div>
              </div>

              {/* Campus Notices */}
              <div className="p-5 rounded-2xl bg-stone-50 border border-stone-200 mb-6">
                <div className="flex items-center gap-2 mb-3">
                  <span className="text-lg">📢</span>
                  <h3 className="font-extrabold text-stone-900 text-sm">Campus Notice Board & System Broadcast</h3>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs text-stone-600">
                  <div className="p-3 bg-white rounded-lg border border-stone-200">
                    <span className="font-bold text-stone-800">Examination Timetable:</span> Final semester timetables and hall tickets are live in the student portal.
                  </div>
                  <div className="p-3 bg-white rounded-lg border border-stone-200">
                    <span className="font-bold text-stone-800">New Registration:</span> Open for academic year 2026 across Computer Science, IT, and AI & DS.
                  </div>
                  <div className="p-3 bg-white rounded-lg border border-stone-200">
                    <span className="font-bold text-stone-800">System Security:</span> End-to-end JWT authentication and real-time SQLite database persistence active.
                  </div>
                </div>
              </div>

            </main>
          )}

          {/* ========================================================
              PAGE 2: INSIDE PORTAL GATEWAY (MERGED 1-BOX AUTH)
              (Student Login, Student Register, Admin Control inside 1 Box)
             ======================================================== */}
          {currentPage === 'portal' && (
            <main className="flex-1 px-4 sm:px-6 py-8 max-w-4xl mx-auto w-full fade-in">
              
              {/* Back to Dashboard Navigation Header */}
              <div className="flex items-center justify-between mb-6">
                <button
                  type="button"
                  onClick={() => navigateTo('dashboard')}
                  className="inline-flex items-center gap-2 text-xs sm:text-sm font-bold text-[#7c2d12] bg-[#fff7ed] hover:bg-[#ffedd5] px-4 py-2 rounded-xl border border-[#fed7aa] transition shadow-xs"
                >
                  <span>←</span>
                  <span>Back to Main Dashboard</span>
                </button>

                <span className="text-xs font-bold text-stone-500">
                  Inside Dashboard • Step 2 of 2
                </span>
              </div>

              {/* THE MERGED 1 BOX (Warm Sunset Glow Card) */}
              <div className="bg-white rounded-3xl border border-[#fed7aa] card-warm-glow overflow-hidden grid grid-cols-1 md:grid-cols-12 min-h-[580px]">
                
                {/* Left Brand Showcase Column */}
                <div className="md:col-span-5 bg-gradient-to-br from-[#fff7ed] via-[#ffedd5] to-[#fed7aa] border-r border-[#fed7aa] p-8 flex flex-col justify-between">
                  <div>
                    <div className="flex items-center gap-2.5 mb-6">
                      <img src="/static/campuscore-logo.png" alt="Emblem" className="w-10 h-10 rounded-full border border-white shadow-xs object-cover bg-white" />
                      <div>
                        <span className="text-[10px] font-extrabold uppercase tracking-widest text-[#c2410c]">INSIDE GATEWAY</span>
                        <h3 className="font-extrabold text-base text-[#7c2d12] leading-none">CAMPUSCORE</h3>
                      </div>
                    </div>

                    <h2 className="text-2xl font-extrabold text-[#7c2d12] leading-snug mb-3">
                      CAMPUSCORE Portal
                    </h2>
                    <p className="text-xs sm:text-sm text-[#9a3412] font-semibold leading-relaxed mb-6">
                      Access your student dashboard, academic standings, and institutional records securely.
                    </p>

                    <div className="space-y-3 mb-6">
                      <div className="flex items-center gap-2.5 text-xs text-[#7c2d12] font-bold">
                        <span className="w-5 h-5 rounded-full bg-orange-600 text-white flex items-center justify-center text-[10px] flex-shrink-0">✓</span>
                        <span>Interactive real-time field validation</span>
                      </div>
                      <div className="flex items-center gap-2.5 text-xs text-[#7c2d12] font-bold">
                        <span className="w-5 h-5 rounded-full bg-orange-600 text-white flex items-center justify-center text-[10px] flex-shrink-0">✓</span>
                        <span>Enhanced password security rules</span>
                      </div>
                      <div className="flex items-center gap-2.5 text-xs text-[#7c2d12] font-bold">
                        <span className="w-5 h-5 rounded-full bg-orange-600 text-white flex items-center justify-center text-[10px] flex-shrink-0">✓</span>
                        <span>Seamless localhost database integration</span>
                      </div>
                      <div className="flex items-center gap-2.5 text-xs text-[#7c2d12] font-bold">
                        <span className="w-5 h-5 rounded-full bg-orange-600 text-white flex items-center justify-center text-[10px] flex-shrink-0">✓</span>
                        <span>Role-based JWT session tokens</span>
                      </div>
                    </div>

                    {/* Logo in White Badge */}
                    <div className="p-4 bg-white/85 border border-[#fed7aa] rounded-2xl text-center shadow-xs">
                      <img src="/static/campuscore-logo.png" alt="Symbol" className="w-20 h-20 mx-auto rounded-full object-cover mb-2 border border-orange-200" />
                      <p className="text-xs font-black text-[#7c2d12]">“Connecting Campus. Empowering Futures.”</p>
                      <p className="text-[10px] text-orange-600 font-bold mt-0.5">Digital Campus Platform</p>
                    </div>
                  </div>

                  <div className="pt-4 text-center">
                    <p className="text-[11px] text-[#9a3412] font-medium">© 2026 CAMPUSCORE. All rights reserved.</p>
                  </div>
                </div>

                {/* Right Interactive Form Column with 3 Tabs */}
                <div className="md:col-span-7 p-6 sm:p-9 flex flex-col justify-center bg-white">
                  
                  {/* Tab Selector: Student Login | Student Register | Admin Control */}
                  <div className="flex p-1 bg-[#fff7ed] rounded-xl mb-6 border border-[#fed7aa]">
                    <button

                      onClick={() => { setActiveTab('student-login'); setAlert(null); window.location.hash = 'student-login'; }}

                        activeTab === 'student-login'
                          ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-xs'
                          : 'text-[#9a3412] hover:text-[#7c2d12]'
                      }`}
                    >
                      Student Login
                    </button>
                    <button
                      type="button"
                      onClick={() => { setActiveTab('student-register'); setAlert(null); window.location.hash = 'register'; }}
                      className={`flex-1 py-2 px-2 text-xs sm:text-sm font-bold rounded-lg transition-all ${
                        activeTab === 'student-register'
                          ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-xs'
                          : 'text-[#9a3412] hover:text-[#7c2d12]'

                      Register

                          ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-xs'
                          : 'text-[#9a3412] hover:text-[#7c2d12]'

                      Admin Control
                    </button>
                  </div>

                  {alert && (

                      alert.type === 'success' 
                        ? 'bg-emerald-50 text-emerald-800 border-emerald-200' 
                        : 'bg-rose-50 text-rose-800 border-rose-200'
                    }`}>
                      <span>{alert.type === 'success' ? '✓' : '⚠'}</span>
                      <span>{alert.message}</span>
                    </div>
                  )}

                      TAB 1: STUDENT LOGIN
                     ======================================================== */}

                      </div>

                          <label className="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1">
                            Student Email <span className="text-rose-500">*</span>
                          </label>
                          <input
                            type="email"
                            required
                            placeholder="student@campuscore.com"
                            value={studentLogin.email}
                            onChange={(e) => setStudentLogin({ ...studentLogin, email: e.target.value })}

                        <div>
                          <div className="flex justify-between items-center mb-1">
                            <label className="block text-xs font-bold text-stone-700 uppercase tracking-wider">
                              Password <span className="text-rose-500">*</span>
                            </label>
                            <button
                              type="button"
                              onClick={() => setShowPassword(!showPassword)}
                              className="text-xs text-orange-600 font-bold hover:underline"
                            >
                              {showPassword ? 'Hide' : 'Show'}
                            </button>
                          </div>
                          <input
                            type={showPassword ? 'text' : 'password'}
                            required
                            placeholder="Enter your student password"
                            value={studentLogin.password}

                        <button
                          type="submit"
                          disabled={loading}

                        </div>

                          type="button"
                          onClick={() => setStudentLogin({ email: 'student@campuscore.com', password: 'Student@2026' })}

                          Autofill Demo
                        </button>
                      </div>
                    </div>
                  )}

                  {/* ========================================================
                      TAB 2: STUDENT REGISTRATION
                     ======================================================== */}
                  {activeTab === 'student-register' && (

                      <div className="mb-4">
                        <h3 className="text-lg font-extrabold text-stone-900">Student Registration</h3>
                        <p className="text-xs text-stone-500">Create a new institutional student profile.</p>
                      </div>

                      <form onSubmit={handleStudentRegister} className="space-y-3">
                        <div className="grid grid-cols-2 gap-2.5">
                          <div>
                            <label className="block text-xs font-bold text-stone-700 mb-0.5">Full Name *</label>
                            <input
                              type="text"
                              required
                              placeholder="John Doe"
                              value={studentReg.name}
                              onChange={(e) => setStudentReg({ ...studentReg, name: e.target.value })}
                              className="w-full px-3 py-1.5 bg-stone-50 border border-stone-300 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-stone-700 mb-0.5">Student ID *</label>
                            <input
                              type="text"
                              required
                              placeholder="CC202611"
                              value={studentReg.student_id}
                              onChange={(e) => setStudentReg({ ...studentReg, student_id: e.target.value })}
                              className="w-full px-3 py-1.5 bg-stone-50 border border-stone-300 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-2.5">
                          <div>
                            <label className="block text-xs font-bold text-stone-700 mb-0.5">Email *</label>
                            <input
                              type="email"
                              required
                              placeholder="name@campuscore.com"
                              value={studentReg.email}
                              onChange={(e) => setStudentReg({ ...studentReg, email: e.target.value })}
                              className="w-full px-3 py-1.5 bg-stone-50 border border-stone-300 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-stone-700 mb-0.5">Phone</label>
                            <input
                              type="tel"
                              placeholder="+91 987..."

                              onChange={(e) => setStudentReg({ ...studentReg, phone: e.target.value })}
                              className="w-full px-3 py-1.5 bg-stone-50 border border-stone-300 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-2.5">
                          <div>
                            <label className="block text-xs font-bold text-stone-700 mb-0.5">Department</label>
                            <select
                              value={studentReg.department}
                              onChange={(e) => setStudentReg({ ...studentReg, department: e.target.value })}
                              className="w-full px-2 py-1.5 bg-stone-50 border border-stone-300 rounded-lg text-xs focus:ring-2 focus:ring-orange-500"
                            >
                              <option>Computer Science</option>
                              <option>Information Tech</option>
                              <option>AI & Data Science</option>
                              <option>Electronics & Comm</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-stone-700 mb-0.5">Year</label>
                            <select
                              value={studentReg.year}
                              onChange={(e) => setStudentReg({ ...studentReg, year: e.target.value })}
                              className="w-full px-2 py-1.5 bg-stone-50 border border-stone-300 rounded-lg text-xs focus:ring-2 focus:ring-orange-500"
                            >
                              <option>1st Year</option>
                              <option>2nd Year</option>
                              <option>3rd Year</option>
                              <option>4th Year</option>
                            </select>
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-2.5">
                          <div>
                            <label className="block text-xs font-bold text-stone-700 mb-0.5">Password *</label>
                            <input
                              type="password"
                              required
                              placeholder="Min 6 chars"
                              value={studentReg.password}
                              onChange={(e) => setStudentReg({ ...studentReg, password: e.target.value })}
                              className="w-full px-3 py-1.5 bg-stone-50 border border-stone-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-orange-500"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-stone-700 mb-0.5">Confirm *</label>
                            <input
                              type="password"
                              required
                              placeholder="Re-type"
                              value={studentReg.confirm_password}
                              onChange={(e) => setStudentReg({ ...studentReg, confirm_password: e.target.value })}
                              className="w-full px-3 py-1.5 bg-stone-50 border border-stone-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-orange-500"
                            />
                          </div>
                        </div>

                        <button
                          type="submit"
                          disabled={loading}
                          className="w-full py-2.5 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold rounded-lg shadow-sm hover:shadow transition disabled:opacity-60 text-xs sm:text-sm mt-1"

                          {loading ? 'Registering...' : 'Register as Student'}
                        </button>
                      </form>
                    </div>
                  )}

                  {/* ========================================================
                      TAB 3: ADMIN CONTROL
                     ======================================================== */}
                  {activeTab === 'admin-login' && (
                    <div>

                        <h3 className="text-lg font-extrabold text-stone-900">Administrator Portal</h3>
                        <p className="text-xs text-stone-500">Student records, CRUD operations, and institutional stats.</p>

                      <form onSubmit={handleAdminLogin} className="space-y-3.5">

                        <div>
                          <div className="flex justify-between items-center mb-1">
                            <label className="block text-xs font-bold text-stone-700 uppercase tracking-wider">
                              Master Password <span className="text-rose-500">*</span>
                            </label>
                            <button
                              type="button"
                              onClick={() => setShowPassword(!showPassword)}
                              className="text-xs text-orange-600 font-bold hover:underline"
                            >
                              {showPassword ? 'Hide' : 'Show'}
                            </button>
                          </div>
                          <input
                            type={showPassword ? 'text' : 'password'}
                            required
                            placeholder="Enter master password"
                            value={adminLogin.password}
                            onChange={(e) => setAdminLogin({ ...adminLogin, password: e.target.value })}
                            className="w-full px-3.5 py-2.5 bg-stone-50 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                          />
                        </div>

                        <button
                          type="submit"
                          disabled={loading}
                          className="w-full py-2.5 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold rounded-lg shadow-sm hover:shadow transition disabled:opacity-60 text-sm"

                          {loading ? 'Authenticating Admin...' : 'Sign In as Administrator'}
                        </button>
                      </form>

                      {/* Demo Autofill */}
                      <div className="mt-5 p-3 bg-[#fff7ed] border border-[#fed7aa] rounded-xl flex items-center justify-between gap-2">
                        <div className="text-xs text-[#7c2d12] truncate">
                          <span className="font-bold">Admin Demo:</span> admin@campuscore.com
                        </div>
                        <button
                          type="button"
                          onClick={() => setAdminLogin({ email: 'admin@campuscore.com', password: 'Admin@2026' })}
                          className="text-xs px-2.5 py-1 bg-white border border-[#fed7aa] rounded-md text-orange-600 font-bold hover:bg-orange-50 transition shadow-xs flex-shrink-0"
                        >
                          Autofill Demo
                        </button>
                      </div>
                    </div>
                  )}

                </div>
              </div>
            </main>
          )}

          {/* ========================================================
              FOOTER
             ======================================================== */}
          <footer className="border-t border-[#fed7aa]/50 bg-stone-50/50 py-6 px-4 text-center text-xs text-stone-500 font-medium">
            <div className="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <img src="/static/campuscore-logo.png" alt="Emblem" className="w-5 h-5 rounded-full" />
                <span className="font-extrabold text-stone-800">CAMPUSCORE</span>
                <span>• Digital Campus Platform</span>
              </div>
              <p>© 2026 CAMPUSCORE. “Connecting Campus. Empowering Futures.” All rights reserved.</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
