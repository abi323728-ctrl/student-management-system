<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMPUSCORE | Digital Campus Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: {
              orange: '#ea580c',
              amber: '#f97316',
              light: '#fff7ed',
              border: '#fed7aa',
              dark: '#7c2d12'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; }
    .auth-warm-glow {
      box-shadow: 
        0 0 50px 12px rgba(251, 146, 60, 0.22),
        0 0 90px 30px rgba(254, 215, 170, 0.28),
        0 15px 30px -10px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .auth-warm-glow:hover {
      box-shadow: 
        0 0 60px 16px rgba(251, 146, 60, 0.28),
        0 0 110px 35px rgba(254, 215, 170, 0.35),
        0 20px 35px -10px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body class="bg-white text-slate-800 min-h-screen p-4 sm:p-8 antialiased flex flex-col justify-center">
  <div id="root" class="w-full max-w-7xl mx-auto"></div>

  <!-- Shared Auth & API Script -->
  <script src="/static/app.js"></script>

  <!-- React 3-Box Application -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function ThreeBoxAuthApp() {
      const [loading, setLoading] = useState(null); // 'student-login' | 'student-register' | 'admin-login' | null
      const [alert, setAlert] = useState(null);
      const [showStudentPass, setShowStudentPass] = useState(false);
      const [showAdminPass, setShowAdminPass] = useState(false);

      // Box 1: Student Login State
      const [studentLogin, setStudentLogin] = useState({ email: '', password: '' });

      // Box 2: Student Register State
      const [studentReg, setStudentReg] = useState({
        name: '',
        student_id: '',
        email: '',
        phone: '',
        department: 'Computer Science',
        year: '1st Year',
        password: '',
        confirm_password: ''
      });

      // Box 3: Admin Login State
      const [adminLogin, setAdminLogin] = useState({ email: '', password: '' });

      useEffect(() => {
        const token = window.auth.getToken();
        const role = window.auth.getRole();
        if (token && role === 'admin') window.location.href = '/admin';
        if (token && role === 'student') window.location.href = '/student';
      }, []);

      const showAlert = (message, type = 'error') => {
        setAlert({ message, type });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Handler: Student Login
      const handleStudentLogin = async (e) => {
        e.preventDefault();
        setAlert(null);
        if (!studentLogin.email || !studentLogin.password) {
          showAlert('Please enter both student email and password.');
          return;
        }

        setLoading('student-login');
        try {
          const res = await window.api.loginStudent(studentLogin.email, studentLogin.password);
          window.auth.setSession(res.access_token, res.role, res.user);
          showAlert('Student login successful! Redirecting...', 'success');
          setTimeout(() => { window.location.href = '/student'; }, 800);
        } catch (err) {
          showAlert(err.message);
        } finally {
          setLoading(null);
        }
      };

      // Handler: Student Register
      const handleStudentRegister = async (e) => {
        e.preventDefault();
        setAlert(null);

        if (!studentReg.name || !studentReg.student_id || !studentReg.email || !studentReg.password) {
          showAlert('Please fill in all required registration fields.');
          return;
        }
        if (studentReg.password.length < 6) {
          showAlert('Password must be at least 6 characters long.');
          return;
        }
        if (studentReg.password !== studentReg.confirm_password) {
          showAlert('Passwords do not match.');
          return;
        }

        setLoading('student-register');
        try {
          const res = await window.api.registerStudent({
            name: studentReg.name,
            student_id: studentReg.student_id,
            email: studentReg.email,
            phone: studentReg.phone,
            department: studentReg.department,
            year: studentReg.year,
            password: studentReg.password
          });
          window.auth.setSession(res.access_token, res.role, res.user);
          showAlert('Student registered and authenticated! Redirecting...', 'success');
          setTimeout(() => { window.location.href = '/student'; }, 1000);
        } catch (err) {
          showAlert(err.message);
        } finally {
          setLoading(null);
        }
      };

      // Handler: Admin Login
      const handleAdminLogin = async (e) => {
        e.preventDefault();
        setAlert(null);
        if (!adminLogin.email || !adminLogin.password) {
          showAlert('Please enter administrator email and password.');
          return;
        }

        setLoading('admin-login');
        try {
          const res = await window.api.loginAdmin(adminLogin.email, adminLogin.password);
          window.auth.setSession(res.access_token, res.role, res.user);
          showAlert('Admin verified! Redirecting to Management Console...', 'success');
          setTimeout(() => { window.location.href = '/admin'; }, 800);
        } catch (err) {
          showAlert(err.message);
        } finally {
          setLoading(null);
        }
      };

      return (
        <div>
          {/* Top Brand Showcase Banner */}
          <header className="text-center mb-8 sm:mb-10">
            <div className="inline-flex items-center gap-3 p-2 px-5 rounded-full bg-[#fff7ed] border border-[#fed7aa] shadow-xs mb-3">
              <img src="/static/campuscore-logo.png" alt="CAMPUSCORE" className="w-9 h-9 rounded-full border border-white shadow-xs object-cover" />
              <span className="text-xs font-extrabold tracking-wider uppercase text-[#c2410c]">CAMPUSCORE PLATFORM</span>
            </div>
            <h1 className="text-3xl sm:text-4xl font-extrabold text-[#7c2d12] tracking-tight">
              CAMPUSCORE Student Management System
            </h1>
            <p className="text-sm text-[#9a3412] font-semibold mt-1 max-w-xl mx-auto">
              Digital Campus Platform • Choose your dedicated authentication portal below.
            </p>

            {/* Alert Message Banner */}
            {alert && (
              <div className={`mt-5 max-w-2xl mx-auto p-4 rounded-xl text-sm flex items-center justify-center gap-2 border font-bold ${
                alert.type === 'success' 
                  ? 'bg-emerald-50 text-emerald-800 border-emerald-200' 
                  : 'bg-rose-50 text-rose-800 border-rose-200'
              }`}>
                <span>{alert.type === 'success' ? '✓' : '⚠'}</span>
                <span>{alert.message}</span>
              </div>
            )}
          </header>

          {/* Three Separate Boxes Grid */}
          <main className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8 items-start">
            
            {/* ========================================================
                BOX 1: STUDENT LOGIN
               ======================================================== */}
            <div className="bg-white rounded-2xl border border-[#fed7aa] auth-warm-glow p-6 sm:p-7 flex flex-col justify-between">
              <div>
                {/* Box Header */}
                <div className="flex items-center gap-3 pb-4 border-b border-orange-100 mb-5">
                  <div className="w-10 h-10 rounded-xl bg-[#fff7ed] border border-[#fed7aa] flex items-center justify-center text-lg text-orange-600 shadow-xs">
                    🎓
                  </div>
                  <div>
                    <h2 className="text-lg font-extrabold text-stone-900 leading-tight">Student Login</h2>
                    <p className="text-xs text-stone-500 font-medium">Access student dashboard</p>
                  </div>
                </div>

                <form onSubmit={handleStudentLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1">
                      Student Email <span className="text-rose-500">*</span>
                    </label>
                    <input
                      type="email"
                      required
                      placeholder="student@campuscore.com"
                      value={studentLogin.email}
                      onChange={(e) => setStudentLogin({ ...studentLogin, email: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-stone-50 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="block text-xs font-bold text-stone-700 uppercase tracking-wider">
                        Password <span className="text-rose-500">*</span>
                      </label>
                      <button
                        type="button"
                        onClick={() => setShowStudentPass(!showStudentPass)}
                        className="text-xs text-orange-600 font-bold hover:underline"
                      >
                        {showStudentPass ? 'Hide' : 'Show'}
                      </button>
                    </div>
                    <input
                      type={showStudentPass ? 'text' : 'password'}
                      required
                      placeholder="Enter student password"
                      value={studentLogin.password}
                      onChange={(e) => setStudentLogin({ ...studentLogin, password: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-stone-50 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={loading === 'student-login'}
                    className="w-full py-3 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold rounded-lg shadow-sm hover:shadow transition disabled:opacity-60 text-sm mt-2"
                  >
                    {loading === 'student-login' ? 'Authenticating...' : 'Sign In as Student'}
                  </button>
                </form>
              </div>

              {/* Demo Autofill Box */}
              <div className="mt-6 pt-4 border-t border-orange-100/80">
                <div className="p-3 bg-[#fff7ed] border border-[#fed7aa] rounded-xl flex items-center justify-between gap-2">
                  <div className="text-xs text-[#7c2d12] truncate">
                    <span className="font-bold">Demo:</span> student@campuscore.com
                  </div>
                  <button
                    type="button"
                    onClick={() => setStudentLogin({ email: 'student@campuscore.com', password: 'Student@2026' })}
                    className="text-xs px-2.5 py-1 bg-white border border-[#fed7aa] rounded-md text-orange-600 font-bold hover:bg-orange-50 transition shadow-xs flex-shrink-0"
                  >
                    Autofill
                  </button>
                </div>
              </div>
            </div>

            {/* ========================================================
                BOX 2: STUDENT REGISTRATION
               ======================================================== */}
            <div className="bg-white rounded-2xl border border-[#fed7aa] auth-warm-glow p-6 sm:p-7 flex flex-col justify-between">
              <div>
                {/* Box Header */}
                <div className="flex items-center gap-3 pb-4 border-b border-orange-100 mb-5">
                  <div className="w-10 h-10 rounded-xl bg-[#fff7ed] border border-[#fed7aa] flex items-center justify-center text-lg text-orange-600 shadow-xs">
                    📝
                  </div>
                  <div>
                    <h2 className="text-lg font-extrabold text-stone-900 leading-tight">Student Register</h2>
                    <p className="text-xs text-stone-500 font-medium">Enroll new student account</p>
                  </div>
                </div>

                <form onSubmit={handleStudentRegister} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">Full Name *</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Rahul Sharma"
                      value={studentReg.name}
                      onChange={(e) => setStudentReg({ ...studentReg, name: e.target.value })}
                      className="w-full px-3 py-2 bg-stone-50 border border-stone-300 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-bold text-stone-700 mb-1">Student ID *</label>
                      <input
                        type="text"
                        required
                        placeholder="CC202611"
                        value={studentReg.student_id}
                        onChange={(e) => setStudentReg({ ...studentReg, student_id: e.target.value })}
                        className="w-full px-3 py-2 bg-stone-50 border border-stone-300 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-stone-700 mb-1">Phone</label>
                      <input
                        type="tel"
                        placeholder="+91 987..."
                        value={studentReg.phone}
                        onChange={(e) => setStudentReg({ ...studentReg, phone: e.target.value })}
                        className="w-full px-3 py-2 bg-stone-50 border border-stone-300 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">Institutional Email *</label>
                    <input
                      type="email"
                      required
                      placeholder="name@nxtlogic.com"
                      value={studentReg.email}
                      onChange={(e) => setStudentReg({ ...studentReg, email: e.target.value })}
                      className="w-full px-3 py-2 bg-stone-50 border border-stone-300 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-bold text-stone-700 mb-1">Department</label>
                      <select
                        value={studentReg.department}
                        onChange={(e) => setStudentReg({ ...studentReg, department: e.target.value })}
                        className="w-full px-2.5 py-2 bg-stone-50 border border-stone-300 rounded-lg text-xs focus:ring-2 focus:ring-orange-500"
                      >
                        <option>Computer Science</option>
                        <option>Information Tech</option>
                        <option>AI & Data Science</option>
                        <option>Electronics & Comm</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-stone-700 mb-1">Year</label>
                      <select
                        value={studentReg.year}
                        onChange={(e) => setStudentReg({ ...studentReg, year: e.target.value })}
                        className="w-full px-2.5 py-2 bg-stone-50 border border-stone-300 rounded-lg text-xs focus:ring-2 focus:ring-orange-500"
                      >
                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-bold text-stone-700 mb-1">Password *</label>
                      <input
                        type="password"
                        required
                        placeholder="Min 6 chars"
                        value={studentReg.password}
                        onChange={(e) => setStudentReg({ ...studentReg, password: e.target.value })}
                        className="w-full px-3 py-2 bg-stone-50 border border-stone-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-stone-700 mb-1">Confirm *</label>
                      <input
                        type="password"
                        required
                        placeholder="Re-type"
                        value={studentReg.confirm_password}
                        onChange={(e) => setStudentReg({ ...studentReg, confirm_password: e.target.value })}
                        className="w-full px-3 py-2 bg-stone-50 border border-stone-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={loading === 'student-register'}
                    className="w-full py-2.5 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold rounded-lg shadow-sm hover:shadow transition disabled:opacity-60 text-xs sm:text-sm mt-2"
                  >
                    {loading === 'student-register' ? 'Registering...' : 'Register Student'}
                  </button>
                </form>
              </div>

              <div className="mt-4 pt-3 border-t border-orange-100 text-center">
                <span className="text-xs text-stone-400 font-medium">Automatic instant database enrollment</span>
              </div>
            </div>

            {/* ========================================================
                BOX 3: ADMIN LOGIN
               ======================================================== */}
            <div className="bg-white rounded-2xl border border-[#fed7aa] auth-warm-glow p-6 sm:p-7 flex flex-col justify-between">
              <div>
                {/* Box Header */}
                <div className="flex items-center gap-3 pb-4 border-b border-orange-100 mb-5">
                  <div className="w-10 h-10 rounded-xl bg-[#fff7ed] border border-[#fed7aa] flex items-center justify-center text-lg text-orange-600 shadow-xs">
                    🔒
                  </div>
                  <div>
                    <h2 className="text-lg font-extrabold text-stone-900 leading-tight">Admin Portal</h2>
                    <p className="text-xs text-stone-500 font-medium">Student records & CRUD console</p>
                  </div>
                </div>

                <div className="mb-4 p-2.5 rounded-lg bg-[#fff7ed] border border-[#fed7aa] text-[11px] font-bold text-[#c2410c] flex items-center gap-2">
                  <span>🛡️</span> Protected Administrative Access Only
                </div>

                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1">
                      Admin Email <span className="text-rose-500">*</span>
                    </label>
                    <input
                      type="email"
                      required
                      placeholder="admin@campuscore.com"
                      value={adminLogin.email}
                      onChange={(e) => setAdminLogin({ ...adminLogin, email: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-stone-50 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="block text-xs font-bold text-stone-700 uppercase tracking-wider">
                        Master Password <span className="text-rose-500">*</span>
                      </label>
                      <button
                        type="button"
                        onClick={() => setShowAdminPass(!showAdminPass)}
                        className="text-xs text-orange-600 font-bold hover:underline"
                      >
                        {showAdminPass ? 'Hide' : 'Show'}
                      </button>
                    </div>
                    <input
                      type={showAdminPass ? 'text' : 'password'}
                      required
                      placeholder="Enter master password"
                      value={adminLogin.password}
                      onChange={(e) => setAdminLogin({ ...adminLogin, password: e.target.value })}
                      className="w-full px-3.5 py-2.5 bg-stone-50 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={loading === 'admin-login'}
                    className="w-full py-3 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold rounded-lg shadow-sm hover:shadow transition disabled:opacity-60 text-sm mt-2"
                  >
                    {loading === 'admin-login' ? 'Authenticating Admin...' : 'Sign In as Administrator'}
                  </button>
                </form>
              </div>

              {/* Demo Autofill Box */}
              <div className="mt-6 pt-4 border-t border-orange-100/80">
                <div className="p-3 bg-[#fff7ed] border border-[#fed7aa] rounded-xl flex items-center justify-between gap-2">
                  <div className="text-xs text-[#7c2d12] truncate">
                    <span className="font-bold">Demo:</span> admin@campuscore.com
                  </div>
                  <button
                    type="button"
                    onClick={() => setAdminLogin({ email: 'admin@campuscore.com', password: 'Admin@2026' })}
                    className="text-xs px-2.5 py-1 bg-white border border-[#fed7aa] rounded-md text-orange-600 font-bold hover:bg-orange-50 transition shadow-xs flex-shrink-0"
                  >
                    Autofill
                  </button>
                </div>
              </div>
            </div>

          </main>

          {/* Footer Branding */}
          <footer className="mt-10 text-center text-xs text-stone-400 font-semibold">
            © 2026 CAMPUSCORE Digital Campus Platform. All rights reserved.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ThreeBoxAuthApp />);
  </script>
</body>
</html>
