<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | NXTLOGIC SMS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: {
              navy: '#0f172a',
              blue: '#2563eb',
              light: '#f8fafc'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen antialiased">
  <div id="root"></div>

  <!-- Shared Auth & API Script -->
  <script src="/static/app.js"></script>

  <!-- React Admin Component -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function AdminDashboard() {
      const [stats, setStats] = useState(null);
      const [students, setStudents] = useState([]);
      const [loading, setLoading] = useState(true);
      const [search, setSearch] = useState('');
      const [selectedDept, setSelectedDept] = useState('All');
      const [selectedYear, setSelectedYear] = useState('All');
      
      // Modals
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isEditModalOpen, setIsEditModalOpen] = useState(false);
      const [editingStudent, setEditingStudent] = useState(null);
      const [deletingStudent, setDeletingStudent] = useState(null);
      const [msg, setMsg] = useState(null);

      // Add Student Form State
      const [newStudent, setNewStudent] = useState({
        student_id: '',
        name: '',
        email: '',
        phone: '',
        department: 'Computer Science',
        year: '1st Year',
        cgpa: 8.0,
        address: '',
        dob: '',
        password: 'Password@2026'
      });

      useEffect(() => {
        if (!window.auth.requireAuth('admin')) return;
        loadDashboardData();
      }, [search, selectedDept, selectedYear]);

      const loadDashboardData = async () => {
        try {
          setLoading(true);
          const [statsData, studentsData] = await Promise.all([
            window.api.getAdminStats(),
            window.api.getStudents({
              search,
              department: selectedDept,
              year: selectedYear,
              limit: 50
            })
          ]);
          setStats(statsData);
          setStudents(studentsData.items || []);
        } catch (err) {
          alert('Failed to load admin data: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleAddStudent = async (e) => {
        e.preventDefault();
        try {
          await window.api.createStudent({
            ...newStudent,
            cgpa: parseFloat(newStudent.cgpa) || 8.0
          });
          setIsAddModalOpen(false);
          setNewStudent({
            student_id: '',
            name: '',
            email: '',
            phone: '',
            department: 'Computer Science',
            year: '1st Year',
            cgpa: 8.0,
            address: '',
            dob: '',
            password: 'Password@2026'
          });
          setMsg({ type: 'success', text: 'New student enrolled successfully in database!' });
          setTimeout(() => setMsg(null), 4000);
          loadDashboardData();
        } catch (err) {
          alert(err.message);
        }
      };

      const handleEditStudent = async (e) => {
        e.preventDefault();
        try {
          await window.api.updateStudent(editingStudent.id, {
            name: editingStudent.name,
            email: editingStudent.email,
            phone: editingStudent.phone,
            department: editingStudent.department,
            year: editingStudent.year,
            cgpa: parseFloat(editingStudent.cgpa),
            address: editingStudent.address,
            dob: editingStudent.dob
          });
          setIsEditModalOpen(false);
          setEditingStudent(null);
          setMsg({ type: 'success', text: 'Student details updated successfully!' });
          setTimeout(() => setMsg(null), 4000);
          loadDashboardData();
        } catch (err) {
          alert(err.message);
        }
      };

      const handleDeleteStudent = async () => {
        if (!deletingStudent) return;
        try {
          await window.api.deleteStudent(deletingStudent.id);
          setDeletingStudent(null);
          setMsg({ type: 'success', text: `Student record deleted successfully.` });
          setTimeout(() => setMsg(null), 4000);
          loadDashboardData();
        } catch (err) {
          alert(err.message);
        }
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row">
          {/* Sidebar */}
          <aside className="w-full lg:w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col justify-between">
            <div>
              {/* Header */}
              <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                <img src="/static/nxtlogic-logo.jpg" alt="Logo" className="w-10 h-10 rounded-lg object-cover" />
                <div>
                  <h1 className="font-bold text-white text-base">NXTLOGIC</h1>
                  <span className="text-xs text-amber-400 font-semibold tracking-wider uppercase">Admin Control</span>
                </div>
              </div>

              {/* Navigation */}
              <nav className="p-4 space-y-1.5">
                <div className="px-3 py-2 text-xs font-bold text-slate-500 uppercase tracking-wider">Management</div>
                <button className="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-semibold bg-blue-600 text-white shadow-sm">
                  <span>👥</span> Student Records
                </button>
                <div className="px-3 pt-4 pb-2 text-xs font-bold text-slate-500 uppercase tracking-wider">Quick Actions</div>
                <button
                  onClick={() => setIsAddModalOpen(true)}
                  className="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-semibold text-slate-300 hover:bg-slate-800 hover:text-white transition"
                >
                  <span>➕</span> Add New Student
                </button>
              </nav>
            </div>

            {/* Admin Footer & Logout */}
            <div className="p-4 border-t border-slate-800">
              <div className="flex items-center gap-3 mb-3 p-2 rounded-lg bg-slate-800/60">
                <div className="w-9 h-9 rounded-full bg-amber-600 text-white font-bold flex items-center justify-center text-sm">
                  A
                </div>
                <div className="overflow-hidden">
                  <p className="text-sm font-semibold text-white truncate">Administrator</p>
                  <p className="text-xs text-slate-400 truncate">admin@nxtlogic.com</p>
                </div>
              </div>

              <button
                onClick={() => window.auth.logout()}
                className="w-full py-2 px-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 hover:text-red-300 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-2 border border-red-500/20"
              >
                <span>🚪</span> Sign Out
              </button>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 p-6 lg:p-10 max-w-7xl mx-auto w-full">
            {/* Header */}
            <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-6 border-b border-slate-200">
              <div>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
                  Student Management Console
                </h2>
                <p className="text-sm text-slate-500 mt-1">
                  Full CRUD records management, institutional analytics, and database monitoring.
                </p>
              </div>

              <button
                onClick={() => setIsAddModalOpen(true)}
                className="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-sm hover:shadow transition flex items-center gap-2 text-sm"
              >
                <span>➕</span> Add New Student
              </button>
            </header>

            {/* Notification Banner */}
            {msg && (
              <div className="mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm font-medium flex items-center gap-2">
                <span>✓</span> {msg.text}
              </div>
            )}

            {/* Analytics Metric Cards */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Enrolled</p>
                <p className="text-3xl font-extrabold text-slate-900 mt-1">{stats?.total_students || 0}</p>
                <span className="text-xs text-blue-600 font-semibold">Active Database Records</span>
              </div>

              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Average CGPA</p>
                <p className="text-3xl font-extrabold text-emerald-600 mt-1">{stats?.average_cgpa?.toFixed(2) || '0.00'}</p>
                <span className="text-xs text-slate-500 font-medium">Across All Departments</span>
              </div>

              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Departments</p>
                <p className="text-3xl font-extrabold text-indigo-600 mt-1">{Object.keys(stats?.department_distribution || {}).length}</p>
                <span className="text-xs text-slate-500 font-medium">Academic Streams</span>
              </div>

              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">System Status</p>
                <p className="text-xl font-bold text-slate-800 mt-2 flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span> FastAPI Live
                </p>
                <span className="text-xs text-slate-500 font-medium">JWT Security Active</span>
              </div>
            </div>

            {/* Department Breakdown Visual Badges */}
            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm mb-8">
              <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Department Distribution</h3>
              <div className="flex flex-wrap gap-2.5">
                {Object.entries(stats?.department_distribution || {}).map(([dept, count]) => (
                  <div key={dept} className="flex items-center gap-2 px-3.5 py-1.5 rounded-lg bg-slate-50 border border-slate-200 text-xs">
                    <span className="font-semibold text-slate-800">{dept}:</span>
                    <span className="px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-bold">{count}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Student Records Table Section */}
            <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
              {/* Filter & Search Bar */}
              <div className="p-5 border-b border-slate-200 flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center bg-slate-50/50">
                <div className="relative flex-1 max-w-md">
                  <input
                    type="text"
                    placeholder="Search by student name, email, or ID..."
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    className="w-full pl-9 pr-4 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                  <span className="absolute left-3 top-2.5 text-slate-400 text-sm">🔍</span>
                </div>

                <div className="flex items-center gap-3">
                  <select
                    value={selectedDept}
                    onChange={(e) => setSelectedDept(e.target.value)}
                    className="px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs font-medium text-slate-700"
                  >
                    <option value="All">All Departments</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="AI & Data Science">AI & Data Science</option>
                    <option value="Electronics & Comm">Electronics & Comm</option>
                  </select>

                  <select
                    value={selectedYear}
                    onChange={(e) => setSelectedYear(e.target.value)}
                    className="px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs font-medium text-slate-700"
                  >
                    <option value="All">All Years</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                  </select>
                </div>
              </div>

              {/* Data Table */}
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm text-slate-700">
                  <thead className="bg-slate-100 text-xs uppercase font-bold text-slate-500 border-b border-slate-200">
                    <tr>
                      <th className="px-6 py-3.5">Student ID</th>
                      <th className="px-6 py-3.5">Name</th>
                      <th className="px-6 py-3.5">Department</th>
                      <th className="px-6 py-3.5">Year</th>
                      <th className="px-6 py-3.5">CGPA</th>
                      <th className="px-6 py-3.5">Contact</th>
                      <th className="px-6 py-3.5 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {students.length === 0 ? (
                      <tr>
                        <td colSpan="7" className="px-6 py-12 text-center text-slate-400">
                          No student records matching your query.
                        </td>
                      </tr>
                    ) : (
                      students.map((st) => (
                        <tr key={st.id} className="hover:bg-slate-50/80 transition">
                          <td className="px-6 py-4 font-bold text-blue-600">{st.student_id}</td>
                          <td className="px-6 py-4">
                            <p className="font-bold text-slate-900">{st.name}</p>
                            <p className="text-xs text-slate-500">{st.email}</p>
                          </td>
                          <td className="px-6 py-4">{st.department}</td>
                          <td className="px-6 py-4 text-xs font-semibold text-slate-600">
                            <span className="px-2 py-1 bg-slate-100 rounded">{st.year}</span>
                          </td>
                          <td className="px-6 py-4">
                            <span className="font-extrabold text-emerald-600">{st.cgpa?.toFixed(2)}</span>
                          </td>
                          <td className="px-6 py-4 text-xs text-slate-500">{st.phone || 'N/A'}</td>
                          <td className="px-6 py-4 text-right space-x-2">
                            <button
                              onClick={() => {
                                setEditingStudent({ ...st });
                                setIsEditModalOpen(true);
                              }}
                              className="px-2.5 py-1 text-xs font-semibold text-blue-600 hover:bg-blue-50 border border-blue-200 rounded transition"
                            >
                              Edit
                            </button>
                            <button
                              onClick={() => setDeletingStudent(st)}
                              className="px-2.5 py-1 text-xs font-semibold text-rose-600 hover:bg-rose-50 border border-rose-200 rounded transition"
                            >
                              Delete
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            {/* ADD STUDENT MODAL */}
            {isAddModalOpen && (
              <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl border border-slate-200">
                  <div className="flex justify-between items-center pb-4 border-b border-slate-100 mb-4">
                    <h3 className="font-bold text-lg text-slate-900">Enroll New Student</h3>
                    <button onClick={() => setIsAddModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
                  </div>

                  <form onSubmit={handleAddStudent} className="space-y-3.5">
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Student ID / Roll No *</label>
                        <input
                          type="text"
                          required
                          placeholder="NXT202615"
                          value={newStudent.student_id}
                          onChange={(e) => setNewStudent({ ...newStudent, student_id: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Full Name *</label>
                        <input
                          type="text"
                          required
                          placeholder="Student Name"
                          value={newStudent.name}
                          onChange={(e) => setNewStudent({ ...newStudent, name: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Email Address *</label>
                        <input
                          type="email"
                          required
                          placeholder="student@nxtlogic.com"
                          value={newStudent.email}
                          onChange={(e) => setNewStudent({ ...newStudent, email: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Phone Number</label>
                        <input
                          type="tel"
                          placeholder="+91 9876543210"
                          value={newStudent.phone}
                          onChange={(e) => setNewStudent({ ...newStudent, phone: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Department</label>
                        <select
                          value={newStudent.department}
                          onChange={(e) => setNewStudent({ ...newStudent, department: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                        >
                          <option>Computer Science</option>
                          <option>Information Technology</option>
                          <option>AI & Data Science</option>
                          <option>Electronics & Comm</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Year</label>
                        <select
                          value={newStudent.year}
                          onChange={(e) => setNewStudent({ ...newStudent, year: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                        >
                          <option>1st Year</option>
                          <option>2nd Year</option>
                          <option>3rd Year</option>
                          <option>4th Year</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">CGPA</label>
                        <input
                          type="number"
                          step="0.01"
                          min="0"
                          max="10"
                          value={newStudent.cgpa}
                          onChange={(e) => setNewStudent({ ...newStudent, cgpa: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                        />
                      </div>
                    </div>

                    <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                      <button
                        type="button"
                        onClick={() => setIsAddModalOpen(false)}
                        className="px-4 py-2 border border-slate-300 rounded-lg text-sm font-semibold text-slate-700 hover:bg-slate-50"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold shadow-sm"
                      >
                        Enroll Student
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* EDIT STUDENT MODAL */}
            {isEditModalOpen && editingStudent && (
              <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl border border-slate-200">
                  <div className="flex justify-between items-center pb-4 border-b border-slate-100 mb-4">
                    <h3 className="font-bold text-lg text-slate-900">Edit Student Record: {editingStudent.student_id}</h3>
                    <button onClick={() => setIsEditModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
                  </div>

                  <form onSubmit={handleEditStudent} className="space-y-3.5">
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
                        <input
                          type="text"
                          value={editingStudent.name}
                          onChange={(e) => setEditingStudent({ ...editingStudent, name: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Email</label>
                        <input
                          type="email"
                          value={editingStudent.email}
                          onChange={(e) => setEditingStudent({ ...editingStudent, email: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Department</label>
                        <select
                          value={editingStudent.department}
                          onChange={(e) => setEditingStudent({ ...editingStudent, department: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                        >
                          <option>Computer Science</option>
                          <option>Information Technology</option>
                          <option>AI & Data Science</option>
                          <option>Electronics & Comm</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Year</label>
                        <select
                          value={editingStudent.year}
                          onChange={(e) => setEditingStudent({ ...editingStudent, year: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                        >
                          <option>1st Year</option>
                          <option>2nd Year</option>
                          <option>3rd Year</option>
                          <option>4th Year</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">CGPA</label>
                        <input
                          type="number"
                          step="0.01"
                          min="0"
                          max="10"
                          value={editingStudent.cgpa}
                          onChange={(e) => setEditingStudent({ ...editingStudent, cgpa: e.target.value })}
                          className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"
                        />
                      </div>
                    </div>

                    <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                      <button
                        type="button"
                        onClick={() => setIsEditModalOpen(false)}
                        className="px-4 py-2 border border-slate-300 rounded-lg text-sm font-semibold text-slate-700 hover:bg-slate-50"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold shadow-sm"
                      >
                        Save Updates
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* DELETE CONFIRMATION MODAL */}
            {deletingStudent && (
              <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                  <h3 className="font-bold text-lg text-slate-900 mb-2">Delete Student Record?</h3>
                  <p className="text-sm text-slate-600 mb-6">
                    Are you sure you want to permanently delete <strong className="text-slate-900">{deletingStudent.name}</strong> ({deletingStudent.student_id}) from the database? This action cannot be undone.
                  </p>
                  <div className="flex justify-end gap-3">
                    <button
                      onClick={() => setDeletingStudent(null)}
                      className="px-4 py-2 border border-slate-300 rounded-lg text-sm font-semibold text-slate-700 hover:bg-slate-50"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={handleDeleteStudent}
                      className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-sm font-semibold shadow-sm"
                    >
                      Confirm Delete
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminDashboard />);
  </script>
</body>
</html>
